<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preventivi — Calcolo Costi</title>
<link rel="stylesheet" href="stile.css">
</head>
<body>

<header>
  <div class="logo-mark">⬡</div>
  <div>
    <h1 id="header-title">Preventivi</h1>
    <span id="header-sub">Seleziona un prodotto</span>
  </div>
  <div class="header-right" id="header-right">v1.0</div>
</header>

<!-- SELETTORE PRODOTTO -->
<div id="product-selector">
  <div class="selector-grid">
    <button class="product-btn" data-product="tiranti">
      <div class="product-icon">⬡</div>
      <div class="product-name">Tiranti</div>
      <div class="product-desc">Da barra a diametro medio<br>senza tornitura</div>
    </button>
    <button class="product-btn" data-product="tiranti_torniti">
      <div class="product-icon">◎</div>
      <div class="product-name">Tiranti Torniti</div>
      <div class="product-desc">Da barra grezza<br>con tornitura</div>
    </button>
    <!-- Futuri moduli -->
    <button class="product-btn disabled" disabled>
      <div class="product-icon">○</div>
      <div class="product-name">Prigionieri</div>
      <div class="product-desc">In sviluppo</div>
    </button>
    <button class="product-btn" data-product="dadi">
      <div class="product-icon">⬡</div>
      <div class="product-name">Dadi</div>
      <div class="product-desc">UNI 5587 / 5588 / 5589<br>con fresatura o stampaggio</div>
    </button>
    <button class="product-btn disabled" disabled>
      <div class="product-icon">○</div>
      <div class="product-name">Tiranti a Occhio</div>
      <div class="product-desc">In sviluppo</div>
    </button>
    <button class="product-btn disabled" disabled>
      <div class="product-icon">○</div>
      <div class="product-name">Viti</div>
      <div class="product-desc">In sviluppo</div>
    </button>
  </div>
</div>

<!-- CALCOLATORE (nascosto finché non si sceglie prodotto) -->
<div id="calculator" style="display:none">
  <div class="main">

    <!-- ═══ INPUTS ═══ -->
    <div class="inputs-panel">

      <div class="back-btn-wrap">
        <button class="back-btn" onclick="tornaAlSelettore()">← Cambia prodotto</button>
      </div>

      <!-- Tipo dado e chiave — solo dadi, in cima -->
      <div id="row-uni" class="form-group" style="display:none">
        <label>Tipo dado (UNI)</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="uni" data-val="5587">5587 Alto</button>
          <button class="toggle-btn" data-group="uni" data-val="5588">5588 Medio</button>
          <button class="toggle-btn" data-group="uni" data-val="5589">5589 Basso</button>
        </div>
      </div>

      <div id="row-chiave-tipo" class="form-group" style="display:none">
        <label>Tipo chiave <span class="label-hint">(solo per pollici)</span></label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="chiave_tipo" data-val="p">P — pesante</button>
          <button class="toggle-btn" data-group="chiave_tipo" data-val="l">L — leggera</button>
        </div>
      </div>

      <!-- GEOMETRIA -->
      <div class="section-label">Geometria</div>
      <div class="form-row">
        <div class="form-group">
          <label>Diametro</label>
          <select id="dia">
            <optgroup label="Metrico">
              <option value="8">M8</option>
              <option value="10">M10</option>
              <option value="12">M12</option>
              <option value="14">M14</option>
              <option value="16">M16</option>
              <option value="18">M18</option>
              <option value="20">M20</option>
              <option value="22">M22</option>
              <option value="24">M24</option>
              <option value="27">M27</option>
              <option value="30">M30</option>
              <option value="33" selected>M33</option>
              <option value="36">M36</option>
              <option value="39">M39</option>
              <option value="42">M42</option>
              <option value="45">M45</option>
              <option value="48">M48</option>
              <option value="52">M52</option>
              <option value="56">M56</option>
              <option value="60">M60</option>
              <option value="64">M64</option>
            </optgroup>
            <optgroup label="Pollici">
              <option value="5/16">5/16"</option>
              <option value="3/8">3/8"</option>
              <option value="7/16">7/16"</option>
              <option value="1/2">1/2"</option>
              <option value="9/16">9/16"</option>
              <option value="5/8">5/8"</option>
              <option value="3/4">3/4"</option>
              <option value="7/8">7/8"</option>
              <option value="1000">1"</option>
              <option value="1108">1 1/8"</option>
              <option value="1104">1 1/4"</option>
              <option value="1308">1 3/8"</option>
              <option value="1102">1 1/2"</option>
              <option value="1508">1 5/8"</option>
              <option value="1304">1 3/4"</option>
              <option value="1708">1 7/8"</option>
              <option value="2000">2"</option>
              <option value="2104">2 1/4"</option>
              <option value="2102">2 1/2"</option>
              <option value="2304">2 3/4"</option>
              <option value="3000">3"</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group">
          <label>Passo</label>
          <select id="passo">
            <option value="G" selected>G — Grosso</option>
            <option value="F">F — Fine</option>
            <option value="8UN">8UN</option>
            <option value="UNC">UNC</option>
            <option value="UNF">UNF</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div id="row-lungh" class="form-group">
          <label>Lunghezza (mm)</label>
          <input type="number" id="lungh" value="100" min="1">
        </div>
        <div id="row-altez" class="form-group" style="display:none">
          <label>Altezza (mm) <span class="label-hint" id="altez-hint">da tabella</span></label>
          <input type="number" id="altez_override" value="" step="0.5" placeholder="auto">
        </div>
        <div class="form-group qta-highlight">
          <label>Qtà totale</label>
          <input type="text" id="qta" value="30" placeholder="es. 300+240+850">
          <div id="qta-preview"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Qtà sottocommessa <span class="label-hint">(0 = usa qtà totale)</span></label>
        <input type="number" id="qta_x" value="0" min="0">
      </div>

      <!-- Diametro disponibile — solo torniti -->
      <div id="row-dia-disp" class="form-group" style="display:none">
        <label>Diametro barra grezza (mm)</label>
        <input type="number" id="dia_disp" value="50" min="1" step="1">
      </div>

      <!-- MATERIALE -->
      <div class="section-divider"></div>
      <div class="section-label">Materiale</div>

      <div class="form-group">
        <label>Materiale</label>
        <select id="mat">
          <option value="B7" selected>B7</option>
          <option value="L7">L7</option>
          <option value="B7M">B7M</option>
          <option value="42CD4">42CD4</option>
          <option value="inox">Inox</option>
          <option value="altro">Altro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Costo materiale (€/kg) <span class="label-hint" id="costo-mat-hint"></span></label>
        <input type="number" id="costo_mat_override" value="1.87" step="0.001">
      </div>

      <div id="altro-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Materiale speciale</label>
            <select id="materiale_speciale">
              <option value="0">— Generico —</option>
              <option value="F53">F53</option>
              <option value="660">660</option>
              <option value="718">718</option>
            </select>
          </div>
          <div class="form-group">
            <label>Densità (g/cm³)</label>
            <input type="number" id="dens_altro" value="7.916" step="0.001">
          </div>
        </div>
      </div>

      <!-- OPZIONI -->
      <div class="section-divider"></div>
      <div class="section-label">Opzioni</div>

      <!-- Prigioniero — solo tiranti normali -->
      <div id="row-prigioniero" class="form-group">
        <label>Prigioniero</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="prigioniero" data-val="OFF">OFF</button>
          <button class="toggle-btn" data-group="prigioniero" data-val="ON">ON</button>
        </div>
      </div>
      <div id="prigioniero-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Filetto A (mm)</label>
            <input type="number" id="fil_a" value="25">
          </div>
          <div class="form-group">
            <label>Filetto B (mm)</label>
            <input type="number" id="fil_b" value="25">
          </div>
        </div>
      </div>

      <!-- Fantina — solo torniti -->
      <div id="row-fantina" class="form-group" style="display:none">
        <label>Fantina</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="fantina" data-val="OFF">OFF</button>
          <button class="toggle-btn" data-group="fantina" data-val="ON">ON</button>
        </div>
      </div>

      <!-- Barra Giusta — solo torniti -->
      <div id="row-barra-giusta" class="form-group" style="display:none">
        <label>Barra Giusta <span class="label-hint">(paga barra intera)</span></label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="barra_giusta" data-val="OFF">OFF</button>
          <button class="toggle-btn" data-group="barra_giusta" data-val="ON">ON</button>
        </div>
      </div>
      <div id="lungh-barra-group" style="display:none">
        <div class="form-group">
          <label>Lunghezza barra (mm)</label>
          <input type="number" id="lungh_barra" value="3000" step="100">
        </div>
      </div>

      <!-- Campi specifici DADI -->
      <div id="row-dia-disp-dadi" class="form-group" style="display:none">
        <label>Diametro barra grezza (mm)</label>
        <input type="number" id="dia_disp_dadi" value="60" min="1" step="1">
      </div>

      <div id="row-stampaggio" class="form-group" style="display:none">
        <label>Lavorazione</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="stampaggio" data-val="OFF">Fresatura</button>
          <button class="toggle-btn" data-group="stampaggio" data-val="ON">Stampaggio</button>
        </div>
      </div>

      <div id="row-trattamento" class="form-group" style="display:none">
        <label>Trattamento termico</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="trattamento" data-val="OFF">OFF</button>
          <button class="toggle-btn" data-group="trattamento" data-val="ON">ON</button>
        </div>
      </div>
      <div id="trattamento-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Prezzo €/kg</label>
            <input type="number" id="prezzo_kg" value="1.2" step="0.1">
          </div>
          <div class="form-group">
            <label>Forfait minimo (€)</label>
            <input type="number" id="forfait" value="400" step="10">
          </div>
        </div>
      </div>

      <!-- COSTI BASE -->
      <div class="section-divider"></div>
      <div class="section-label">Costi base (€/s)</div>
      <div class="form-row">
        <div class="form-group">
          <label>Co1 — piccolo diam.</label>
          <input type="number" id="co1" value="0.018" step="0.001">
        </div>
        <div class="form-group">
          <label>Co2 — grande diam.</label>
          <input type="number" id="co2" value="0.022" step="0.001">
        </div>
      </div>

      <button class="calc-btn" onclick="calcola()">⬡ CALCOLA</button>
    </div>

    <!-- ═══ RESULTS ═══ -->
    <div class="results-panel" id="results">
      <div class="results-empty">
        <div class="big-icon">⬡</div>
        <div>Inserisci i parametri e premi CALCOLA</div>
      </div>
    </div>

  </div><!-- .main -->
</div><!-- #calculator -->

<script type="module">
import { calcolaTiranti }        from './moduli/tiranti.js';
import { calcolaTirantiTorniti } from './moduli/tiranti_torniti.js';
import { calcolaDadi }           from './moduli/dadi.js';

// ─── Carica tabelle JSON ──────────────────────────────────
let T = null;   // comune.json
let TD = null;  // dadi.json

Promise.all([
  fetch('./tabelle/comune.json').then(r => r.json()),
  fetch('./tabelle/dadi.json').then(r => r.json()),
]).then(([comune, dadi]) => {
  T = comune;
  TD = dadi;
}).catch(() => { alert('Errore: impossibile caricare le tabelle JSON'); });

// ─── Stato prodotto corrente ──────────────────────────────
let prodottoCorrente = null;

// ─── Selettore prodotto ───────────────────────────────────
document.querySelectorAll('.product-btn:not(.disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    prodottoCorrente = btn.dataset.product;
    mostraCalcolatore(prodottoCorrente);
  });
});

function mostraCalcolatore(prodotto) {
  document.getElementById('product-selector').style.display = 'none';
  document.getElementById('calculator').style.display = 'block';

  const isTornito = prodotto === 'tiranti_torniti';
  const isDadi    = prodotto === 'dadi';
  const isTiranti = prodotto === 'tiranti';

  // Header
  const titoli = { tiranti: 'Tiranti', tiranti_torniti: 'Tiranti Torniti', dadi: 'Dadi' };
  const subs   = { tiranti: 'Da barra a diametro medio', tiranti_torniti: 'Da barra grezza con tornitura', dadi: 'UNI 5587 / 5588 / 5589' };
  document.getElementById('header-title').textContent = titoli[prodotto] || prodotto;
  document.getElementById('header-sub').textContent   = subs[prodotto] || '';

  // Lunghezza — nascosta per i dadi (l'altezza è automatica da tabella)
  document.querySelector('label[for="lungh"]')?.parentElement &&
    (document.getElementById('lungh').closest('.form-group').style.display = isDadi ? 'none' : 'block');

  // Campi specifici
  const show = (id, visible) => {
    const el = document.getElementById(id);
    if (el) el.style.display = visible ? 'block' : 'none';
  };

  show('row-lungh',         !isDadi);
  show('row-altez',          isDadi);
  show('row-dia-disp',       isTornito);
  show('row-prigioniero',    isTiranti);
  show('row-fantina',        isTornito);
  show('row-barra-giusta',   isTornito);
  show('row-uni',            isDadi);
  show('row-chiave-tipo',    isDadi);
  show('row-dia-disp-dadi',  isDadi);
  show('row-stampaggio',     isDadi);
  show('row-trattamento',    isDadi);

  if (isDadi) aggiornaAltezzaDado();

  // Reset risultati
  document.getElementById('results').innerHTML = `
    <div class="results-empty">
      <div class="big-icon">⬡</div>
      <div>Inserisci i parametri e premi CALCOLA</div>
    </div>`;
}

window.tornaAlSelettore = function() {
  document.getElementById('calculator').style.display = 'none';
  document.getElementById('product-selector').style.display = 'block';
  document.getElementById('header-title').textContent = 'Preventivi';
  document.getElementById('header-sub').textContent = 'Seleziona un prodotto';
  prodottoCorrente = null;
};

// ─── Toggle buttons ───────────────────────────────────────
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    document.querySelectorAll(`.toggle-btn[data-group="${group}"]`)
      .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (group === 'prigioniero') {
      document.getElementById('prigioniero-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
    if (group === 'barra_giusta') {
      document.getElementById('lungh-barra-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
    if (group === 'trattamento') {
      document.getElementById('trattamento-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
  });
});

// ─── Costi materiali default ──────────────────────────────
const COSTO_DEFAULT = {
  B7: { val: 1.87,  hint: 'default tabella' },
  L7: { val: 2.09,  hint: 'default tabella' },
  B7M:{ val: 1.98,  hint: 'default tabella' },
  '42CD4': { val: 1.815, hint: 'default tabella' },
  inox:  { val: 0, hint: 'inserire manualmente' },
  altro: { val: 0, hint: 'inserire manualmente' },
};

document.getElementById('mat').addEventListener('change', function() {
  const v = this.value;
  const def = COSTO_DEFAULT[v] || { val: 0, hint: '' };
  document.getElementById('costo_mat_override').value = def.val;
  document.getElementById('costo-mat-hint').textContent = def.hint ? `— ${def.hint}` : '';
  document.getElementById('altro-group').style.display = v === 'altro' ? 'block' : 'none';
});

// ─── Auto-fill altezza dado ───────────────────────────────
function aggiornaAltezzaDado() {
  if (prodottoCorrente !== 'dadi' || !TD) return;
  const dia = getStr('dia');
  const uni = getToggleVal('uni');

  // Diametro nominale: per metrici coincide col numero, per pollici leggiamo dalla tabella comune
  const dian = T?.diametri_nominali_pollici?.[dia] ?? parseFloat(dia);

  let altez = null;
  if (uni === '5587') altez = dian;
  else if (uni === '5588') altez = TD.altezze_5588[String(dia)] ?? null;
  else if (uni === '5589') altez = TD.altezze_5589[String(dia)] ?? null;

  const input = document.getElementById('altez_override');
  const hint  = document.getElementById('altez-hint');
  if (altez !== null) {
    input.value = altez;
    hint.textContent = 'da tabella';
  } else {
    input.value = '';
    hint.textContent = '⚠ inserire manualmente';
  }
}

document.getElementById('dia').addEventListener('change', aggiornaAltezzaDado);
document.querySelectorAll('.toggle-btn[data-group="uni"]').forEach(btn => {
  btn.addEventListener('click', () => setTimeout(aggiornaAltezzaDado, 0));
});
function parseQtaUI(raw) {
  const s = String(raw).trim();
  if (!/^[\d\s+]+$/.test(s)) return NaN;
  const parts = s.split('+').map(p => parseInt(p.trim(), 10));
  if (parts.some(isNaN)) return NaN;
  return parts.reduce((a, b) => a + b, 0);
}

document.getElementById('qta').addEventListener('input', function() {
  const preview = document.getElementById('qta-preview');
  const parts = this.value.split('+').map(p => p.trim()).filter(p => p !== '');
  if (parts.length <= 1) { preview.textContent = ''; return; }
  const nums = parts.map(p => parseInt(p, 10));
  if (nums.some(isNaN)) {
    preview.textContent = '⚠ valore non valido';
    preview.style.color = 'var(--red)';
    return;
  }
  preview.style.color = 'var(--accent)';
  preview.textContent = `= ${nums.reduce((a,b)=>a+b,0)} pz`;
});

// ─── Helpers ──────────────────────────────────────────────
function getStr(id)  { return document.getElementById(id)?.value || ''; }
function getNum(id, fb) {
  const v = parseFloat(document.getElementById(id)?.value);
  return isNaN(v) ? fb : v;
}
function getToggle(group) {
  return document.querySelector(`.toggle-btn.active[data-group="${group}"]`)
    ?.dataset.val === 'ON';
}
function getToggleVal(group) {
  return document.querySelector(`.toggle-btn.active[data-group="${group}"]`)
    ?.dataset.val || '';
}

// ─── CALCOLA ──────────────────────────────────────────────
window.calcola = function() {
  if (!T || !TD) { alert('Tabelle non ancora caricate, riprova tra un secondo.'); return; }
  try {
    T.costi_base.co1 = getNum('co1', 0.018);
    T.costi_base.co2 = getNum('co2', 0.022);

    let R;
    if (prodottoCorrente === 'tiranti') {
      R = calcolaTiranti({
        dia_raw:            getStr('dia'),
        passo:              getStr('passo'),
        lungh_raw:          getNum('lungh', 100),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_override', 0),
        PRIGIONIERO:        getToggle('prigioniero'),
        fil_a:              getNum('fil_a', 25),
        fil_b:              getNum('fil_b', 25),
      }, T);
    } else if (prodottoCorrente === 'tiranti_torniti') {
      R = calcolaTirantiTorniti({
        dia_raw:            getStr('dia'),
        passo:              getStr('passo'),
        lungh_raw:          getNum('lungh', 100),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_override', 0),
        dia_disp:           getNum('dia_disp', 50),
        FANTINA:            getToggle('fantina'),
        BARRA_GIUSTA:       getToggle('barra_giusta'),
        lungh_barra:        getNum('lungh_barra', 3000),
      }, T);
    } else if (prodottoCorrente === 'dadi') {
      // Validazione diametro di partenza
      const _diaDisp  = getNum('dia_disp_dadi', 60);
      const _dia      = getStr('dia');
      const _chiaveT  = getToggleVal('chiave_tipo');
      const _chiave   = TD.chiavi_metriche[_dia]
                     ?? TD.chiavi_pollici_p[_dia]
                     ?? TD.chiavi_pollici_l[_dia];
      if (_chiave) {
        const _spigolo = _chiave * 1.154;
        const _stamp   = getToggle('stampaggio');
        if (!_stamp && _diaDisp < _spigolo) {
          alert(`⚠ Diametro barra (${_diaDisp} mm) inferiore allo spigolo esagono (${_spigolo.toFixed(1)} mm).\nPer fresare devi partire da un tondo più grosso.`);
          return;
        }
        if (_stamp && _diaDisp >= _chiave) {
          alert(`⚠ Diametro barra (${_diaDisp} mm) superiore o uguale alla chiave (${_chiave} mm).\nPer stampare devi partire da un tondo più piccolo della chiave.`);
          return;
        }
      }
      R = calcolaDadi({
        UNI:                getToggleVal('uni'),
        dia_raw:            getStr('dia'),
        passo:              getStr('passo'),
        chiave_tipo:        getToggleVal('chiave_tipo'),
        altez_override:     getNum('altez_override', 0),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_override', 0),
        dia_disp:           getNum('dia_disp_dadi', 60),
        STAMPAGGIO:         getToggle('stampaggio'),
        TRATTAMENTO_TERMICO: getToggle('trattamento'),
        prezzo_kg:          getNum('prezzo_kg', 1.2),
        forfait:            getNum('forfait', 400),
      }, T, TD);
    }

    renderResults(R);
  } catch(e) {
    document.getElementById('results').innerHTML =
      `<div class="error-msg">⚠ ERRORE: ${e.message}</div>`;
  }
};

function r(n, d=2) { return (typeof n === 'number' && !isNaN(n)) ? n.toFixed(d) : '—'; }

function renderResults(R) {
  const panel = document.getElementById('results');
  const isTornito = prodottoCorrente === 'tiranti_torniti';
  const isDadi    = prodottoCorrente === 'dadi';

  function bar(label, val, cls) {
    const pct = R.costo_tot > 0 ? Math.max(2, (val / R.costo_tot) * 100) : 0;
    return `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="bar-amount">€${r(val)}</div>
    </div>`;
  }

  // ── Righe costi ──
  let righe = [];
  if (isDadi) {
    righe = [
      { label: '🟢 Materiale',   val: R.mat_cost,  sub: `peso: ${r(R.peso,3)} kg` },
      ...(R.tratta > 0  ? [{ label: '🌡 Trattamento', val: R.tratta,   sub: '' }] : []),
      ...(R.placc > 0   ? [{ label: '🔧 Placchette',  val: R.placc,    sub: '' }] : []),
      { label: '✂ Taglio',      val: R.ta,        sub: `setup: €${r(R.setup_ta)}` },
      ...(R.pt_serve ? [{ label: '◎ Prima torn.', val: R.pt_costo, sub: `setup: €${r(R.setup_pt)}` }] : []),
      ...(R.STAMPAGGIO
        ? [{ label: '⬡ Stampaggio', val: R.st, sub: `setup: €${r(R.setup_st)}` }]
        : [{ label: '⟋ Fresatura',  val: R.fr, sub: `setup: €${r(R.setup_fr)}` }]),
      { label: '◎ Tornitura',   val: R.to,        sub: `setup: €${r(R.setup_to)}` },
      { label: '🏷 Marcatura',   val: R.marc_fin,  sub: '' },
    ];
  } else if (isTornito) {
    righe = [
      { label: '🟢 Materiale',  val: R.mat_cost,   sub: `peso: ${r(R.peso,3)} kg` },
      ...(R.bonifica > 0 ? [{ label: '🔥 Bonifica', val: R.bonifica, sub: '' }] : []),
      ...(R.attrez > 0   ? [{ label: '🔧 Attrezzatura', val: R.attrez, sub: '' }] : []),
      ...(!R.FANTINA && R.tempo_ta !== null
        ? [{ label: '✂ Taglio', val: R.taglio_fin, sub: `setup: €${r(R.setup_taglio)}` }] : []),
      { label: '◎ Tornitura',  val: R.torni_fin,  sub: `setup: €${r(R.setup_torn)}` },
      { label: '⟳ Rullatura',  val: R.rulla_fin,  sub: `setup: €${r(R.setup_rull)}` },
      { label: '🏷 Marcatura',  val: R.marc_fin,   sub: '' },
    ];
  } else {
    righe = [
      { label: '🟢 Materiale',  val: R.mat_cost,   sub: `peso: ${r(R.peso,3)} kg` },
      ...(R.bonifica > 0 ? [{ label: '🔥 Bonifica', val: R.bonifica, sub: '' }] : []),
      { label: '✂ Taglio',     val: R.taglio_fin,  sub: `setup: €${r(R.setup_taglio)}` },
      { label: '⟋ Smusso',     val: R.smusso_fin,  sub: `setup: €${r(R.setup_smusso)}` },
      { label: '⟳ Rullatura',  val: R.rulla_fin,   sub: `setup: €${r(R.setup_rull)}` },
      { label: '🏷 Marcatura',  val: R.marc_fin,    sub: '' },
    ];
  }

  const gridHTML = righe.map(row => `
    <div class="cost-row">
      <div class="cost-row-label">${row.label}</div>
      <div class="cost-row-value">€${r(row.val)}</div>
      ${row.sub ? `<div class="cost-row-sub">${row.sub}</div>` : ''}
    </div>`).join('');

  // ── Breakdown barre ──
  const barreHTML = (isTornito && R.BARRA_GIUSTA) ? `
    <div class="result-card">
      <div class="breakdown-title">▎ Barre utilizzate</div>
      <div class="cost-grid" style="margin-top:0">
        <div class="cost-row"><div class="cost-row-label">N° barre</div><div class="cost-row-value">${R.num_barre}</div></div>
        <div class="cost-row"><div class="cost-row-label">Peso barre</div><div class="cost-row-value">${r(R.peso_barre,2)} kg</div></div>
      </div>
    </div>` : '';

  // ── Info geometria dadi ──
  const dadiInfoHTML = isDadi ? `
    <div class="result-card">
      <div class="breakdown-title">▎ Geometria dado</div>
      <div class="cost-grid" style="margin-top:0">
        <div class="cost-row"><div class="cost-row-label">Chiave</div><div class="cost-row-value">${r(R.chiave,1)} mm</div></div>
        <div class="cost-row"><div class="cost-row-label">Spigolo</div><div class="cost-row-value">${r(R.spigolo,1)} mm</div></div>
        <div class="cost-row"><div class="cost-row-label">Altezza</div><div class="cost-row-value">${r(R.altez,1)} mm</div></div>
        <div class="cost-row"><div class="cost-row-label">Peso finito</div><div class="cost-row-value">${r(R.peso_fin,3)} kg</div></div>
      </div>
    </div>` : '';

  // ── Tempi grid ──
  let tempiGridHTML = '';
  if (isDadi) {
    if (R.STAMPAGGIO) {
      tempiGridHTML = `
        <div class="tempo-cell"><div class="tc-label">Taglio</div><div class="tc-val">${Math.round(R.tempo_ta)}<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">Stampaggio</div><div class="tc-val">${Math.round(R.tempo_st)}<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">Tornitura</div><div class="tc-val">${Math.round(R.tempo_to)}<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">A.Stamp.</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">A.Torn.</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>`;
    } else {
      tempiGridHTML = `
        ${R.pt_serve ? `<div class="tempo-cell"><div class="tc-label">Prima torn.</div><div class="tc-val">${Math.round(R.pt_tempo)}<span class="tc-unit"> s</span></div></div>` : ''}
        <div class="tempo-cell"><div class="tc-label">Taglio</div><div class="tc-val">${Math.round(R.tempo_ta)}<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">Tornitura</div><div class="tc-val">${Math.round(R.tempo_to)}<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">Fresatura</div><div class="tc-val">${Math.round(R.tempo_fr)}<span class="tc-unit"> s</span></div></div>
        ${R.pt_serve ? `<div class="tempo-cell"><div class="tc-label">A.Prima torn.</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>` : ''}
        <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">A.Torn.</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
        <div class="tempo-cell"><div class="tc-label">A.Fresa</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>`;
    }
  } else if (isTornito) {
    tempiGridHTML = R.FANTINA ? `
      <div class="tempo-cell"><div class="tc-label">Tornitura (fantina)</div><div class="tc-val">${Math.round(R.tempo_torn_fantina)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Rullatura</div><div class="tc-val">${Math.round(R.t_rull)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Torn2</div><div class="tc-val">7200<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Rullatura</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>` : `
      <div class="tempo-cell"><div class="tc-label">Taglio</div><div class="tc-val">${Math.round(R.tempo_ta)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Tornitura</div><div class="tc-val">${Math.round(R.tempo_torn_def)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Rullatura</div><div class="tc-val">${Math.round(R.t_rull)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Torn1</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Rullatura</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>`;
  } else {
    tempiGridHTML = `
      <div class="tempo-cell"><div class="tc-label">Taglio</div><div class="tc-val">${Math.round(R.tempo_ta)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Smusso</div><div class="tc-val">${Math.round(R.smusso_t)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Rullatura</div><div class="tc-val">${Math.round(R.t_rull)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Smusso</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Rullatura</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>`;
  }

  panel.innerHTML = `
    <div class="result-card primary">
      <div class="cost-header">● COSTO TOTALE UNITARIO</div>
      <div class="cost-value"><span class="currency">€</span>${r(R.costo_tot)}<span class="unit">/ pz</span></div>
      <div class="cost-summary">
        Lavorazione: <strong>€${r(R.costo_lav)}</strong>&nbsp;&nbsp;|&nbsp;&nbsp;
        Materiale: <strong>€${r(R.mat_cost)}</strong>
        ${(R.bonifica > 0) ? `&nbsp;&nbsp;|&nbsp;&nbsp;Bonifica: <strong>€${r(R.bonifica)}</strong>` : ''}
        ${(R.tratta > 0)   ? `&nbsp;&nbsp;|&nbsp;&nbsp;Trattamento: <strong>€${r(R.tratta)}</strong>` : ''}
      </div>
    </div>

    <div class="cost-grid">${gridHTML}</div>

    <div class="result-card">
      <div class="breakdown-title">▎ Composizione costo unitario</div>
      ${bar('Materiale', R.mat_cost, 'mat')}
      ${isDadi && R.STAMPAGGIO  ? bar('Stampaggio', R.st + R.setup_st, 'torn') : ''}
      ${isDadi && !R.STAMPAGGIO ? bar('Fresatura',  R.fr + R.setup_fr, 'smusso') : ''}
      ${isDadi ? bar('Tornitura', R.to + R.setup_to, 'torn') : ''}
      ${!isDadi && isTornito    ? bar('Tornitura', R.torni_fin + R.setup_torn, 'torn') : ''}
      ${!isDadi && !isTornito   ? bar('Taglio',    R.taglio_fin + R.setup_taglio, 'taglio') : ''}
      ${!isDadi && !isTornito   ? bar('Smusso',    R.smusso_fin + R.setup_smusso, 'smusso') : ''}
      ${!isDadi ? bar('Rullatura', R.rulla_fin + R.setup_rull, 'rull') : ''}
      ${bar('Marcatura', R.marc_fin, 'marc')}
      ${(R.bonifica > 0) ? bar('Bonifica', R.bonifica, 'bonif') : ''}
      ${(R.tratta > 0)   ? bar('Trattamento', R.tratta, 'bonif') : ''}
    </div>

    ${dadiInfoHTML}
    ${barreHTML}

    <div class="result-card">
      <div class="breakdown-title">▎ Tempi (secondi per pezzo)</div>
      <div class="tempi-grid">${tempiGridHTML}</div>
      <div class="gestionale-wrap">
        <div class="gestionale-title">▎ Per il gestionale</div>
        <div style="display:flex;align-items:flex-start;gap:10px">
          <pre id="tempi-gestionale" class="gestionale-pre">${R.tempi_gestionale}</pre>
          <button class="copia-btn" data-tempi="${R.tempi_gestionale.replace(/\n/g,'\\n')}">COPIA</button>
        </div>
        <div id="copy-feedback" class="copy-feedback"></div>
      </div>
    </div>

    <div class="result-card">
      <div class="breakdown-title">▎ Peso e lotto</div>
      <div class="cost-grid" style="margin-top:0">
        ${!isDadi ? `<div class="cost-row"><div class="cost-row-label">Diametro medio</div><div class="cost-row-value">${r(R.diam,1)} mm</div></div>` : ''}
        <div class="cost-row"><div class="cost-row-label">Peso singolo</div><div class="cost-row-value">${r(R.peso,3)} kg</div></div>
        <div class="cost-row">
          <div class="cost-row-label">${R.qta_x > 0 ? `⭐ Peso sottocommessa (×${R.qta_x})` : `⭐ Peso lotto (×${R.qta})`}</div>
          <div class="cost-row-value accent">${r(R.peso_principale,2)} kg</div>
          <div class="cost-row-sub">reale: ${r(R.peso_principale_reale,2)} kg — coeff. ${r(R.mod_peso,3)}</div>
        </div>
        ${R.peso_lotto_completo !== null ? `
        <div class="cost-row">
          <div class="cost-row-label">Peso lotto totale (×${R.qta})</div>
          <div class="cost-row-value">${r(R.peso_lotto_completo,2)} kg</div>
          <div class="cost-row-sub">approntamenti su ${R.qta} pz${R.qta_str ? ` (${R.qta_str})` : ''}</div>
        </div>` : (R.qta_str ? `
        <div class="cost-row" style="grid-column:span 2">
          <div class="cost-row-label">Dettaglio quantità</div>
          <div class="cost-row-value" style="font-size:13px">${R.qta_str}</div>
        </div>` : '')}
      </div>
    </div>

    ${R.messages && R.messages.length > 0
      ? R.messages.map(m => `<div class="info-box">${m}</div>`).join('') : ''}
  `;

  panel.querySelector('.copia-btn')?.addEventListener('click', function() {
    const text = (this.dataset.tempi || '').replace(/\\n/g, '\n');
    navigator.clipboard.writeText(text).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
    const fb = document.getElementById('copy-feedback');
    if (fb) { fb.textContent = '✓ Copiato negli appunti'; setTimeout(() => fb.textContent = '', 2000); }
  });
}
</script>
</body>
</html>
