<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  PREVENTIVI — Calcolo Costi di Produzione                    ║
  ║  index.html — Interfaccia principale                         ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  STRUTTURA DEL PROGETTO:                                     ║
  ║                                                              ║
  ║  index.html           ← questo file: UI + logica             ║
  ║  stile.css            ← design (colori, layout, font...)     ║
  ║                                                              ║
  ║  tabelle/             ← dati in JSON: modificabili senza     ║
  ║    comune.json          toccare il codice                    ║
  ║    dadi.json                                                 ║
  ║    prigionieri.json                                          ║
  ║                                                              ║
  ║  lib/                                                        ║
  ║    calcolo_comune.js  ← funzioni condivise tra tutti i       ║
  ║                         moduli (peso, materiale, ecc.)       ║
  ║                                                              ║
  ║  moduli/              ← un file .js per ogni prodotto        ║
  ║    tiranti.js                                                ║
  ║    tiranti_torniti.js                                        ║
  ║    dadi.js                                                   ║
  ║    prigionieri.js                                            ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  FLUSSO DI ESECUZIONE:                                       ║
  ║  1. L'utente sceglie il prodotto                             ║
  ║  2. mostraCalcolatore() mostra i campi giusti                ║
  ║  3. L'utente compila e preme CALCOLA                         ║
  ║  4. calcola() legge i valori e chiama il modulo giusto       ║
  ║  5. Il modulo restituisce un oggetto R con tutti i risultati ║
  ║  6. renderResults(R) costruisce e mostra i risultati         ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- viewport: necessario perché la pagina si ridimensioni correttamente
       su schermi piccoli. initial-scale=1 = nessuno zoom iniziale. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preventivi — Calcolo Costi</title>
  <!-- foglio stile esterno: tutto il CSS è in stile.css, non qui dentro -->
  <link rel="stylesheet" href="stile.css">
</head>
<body>


<!-- ═══════════════════════════════════════════════════════════
     HEADER
     Barra superiore sempre visibile. I due elementi con id
     vengono aggiornati dal JS quando si sceglie un prodotto
     (es: "Tiranti Torniti" / "Da barra grezza con tornitura").
     ═══════════════════════════════════════════════════════════ -->
<header>
  <div class="logo-mark">⬡</div>
  <div>
    <h1 id="header-title">Preventivi</h1>
    <span id="header-sub">Seleziona un prodotto</span>
  </div>
  <div class="header-right" id="header-right">v1.0</div>
</header>


<!-- ═══════════════════════════════════════════════════════════
     SELETTORE PRODOTTO
     Visibile all'avvio. Quando l'utente clicca un bottone,
     questa sezione viene nascosta e appare il calcolatore.

     data-product="..." è un "data attribute" (attributo custom):
     non ha effetto visivo, serve solo al JS per sapere quale
     prodotto è stato scelto — si legge con btn.dataset.product.

     I bottoni con classe "disabled" sono moduli in sviluppo.
     ═══════════════════════════════════════════════════════════ -->
<div id="product-selector">
  <div class="selector-grid">

    <button class="product-btn" data-product="tiranti">
      <div class="product-icon">⬡</div>
      <div class="product-name">Tiranti</div>
      <div class="product-desc">Da barra a diametro medio o superiore</div>
    </button>

    <button class="product-btn" data-product="prigionieri">
      <div class="product-icon">◉</div>
      <div class="product-name">Prigionieri</div>
      <div class="product-desc">UNI 5909 / 5911 / libero<br>con tornitura</div>
    </button>

    <button class="product-btn" data-product="dadi">
      <div class="product-icon">⬡</div>
      <div class="product-name">Dadi</div>
      <div class="product-desc">UNI 5587 / 5588 / 5589<br>con fresatura o stampaggio</div>
    </button>

    <!-- disabled = attributo HTML nativo che disabilita il bottone:
         non può essere cliccato, appare grigio (via CSS) -->
    <button class="product-btn" data-product="tiranti_occhio">
      <div class="product-icon">◎</div>
      <div class="product-name">Tiranti a Occhio</div>
      <div class="product-desc">UNI 6058 / libero<br>con fresatura o stampaggio</div>
    </button>

    <button class="product-btn" data-product="viti">
      <div class="product-icon">⬡</div>
      <div class="product-name">Viti</div>
      <div class="product-desc">UNI 5737 / 5739 / 5931<br>con stampaggio o fresatura</div>
    </button>

    <!-- Bottone consultazione tabelle: apre una pagina separata di sola lettura
         con tutte le tabelle da cui il programma pesca i dati.
         onclick con window.location evita che venga catturato dal listener
         dei product-btn (non ha data-product). -->
    <button class="product-btn" onclick="window.location.href='consultazione.html'"
            style="border-style:dashed;">
      <div class="product-icon" style="color:var(--muted);">📋</div>
      <div class="product-name">Tabelle</div>
      <div class="product-desc">Consultazione dati di riferimento<br>(chiavi, diametri, tempi…)</div>
    </button>

  </div>
</div><!-- fine #product-selector -->


<!-- ═══════════════════════════════════════════════════════════
     CALCOLATORE
     Nascosto all'avvio (style="display:none").
     Appare quando si sceglie un prodotto.
     Contiene due colonne affiancate (gestite da .main in CSS):
       .inputs-panel  → form a sinistra con tutti i campi
       .results-panel → area a destra con i risultati
     ═══════════════════════════════════════════════════════════ -->
<div id="calculator" style="display:none">
  <div class="main">


    <!-- ╔══════════════════════════════════╗
         ║        PANNELLO INPUTS           ║
         ╚══════════════════════════════════╝ -->
    <div class="inputs-panel">

      <div class="back-btn-wrap">
        <!-- onclick chiama direttamente una funzione JS.
             Funziona perché la funzione è definita su window
             (vedi più sotto — i module script non espongono
             le funzioni globalmente, bisogna metterle su window). -->
        <button class="back-btn" onclick="tornaAlSelettore()">← Cambia prodotto</button>
      </div>


      <!-- DIAMETRO BARRA GREZZA DADI (solo dadi)
           Campo separato da quello dei torniti perché ha
           validazione diversa:
           - Fresatura: deve essere > spigolo esagono
           - Stampaggio: deve essere < chiave esagono
           La validazione avviene in calcola() prima di chiamare il modulo. -->
      <div id="row-dia-disp-dadi" class="form-group" style="display:none">
        <label>Diametro barra di partenza (mm)</label>
        <input type="text" inputmode="decimal" id="dia_disp_dadi" value="60">
      </div>


      <!-- ─────────────────────────────────────────────────────
           CAMPI ESCLUSIVI DADI — in cima al form
           Mostrati SOLO per i dadi, sopra la sezione geometria,
           perché determinano l'altezza (calcolata da tabella).
           ───────────────────────────────────────────────────── -->

      <!-- Tipo dado UNI:
           5587 = ALTO   → altezza ≈ diametro nominale
           5588 = MEDIO  → altezza da tabella (valori intermedi)
           5589 = BASSO  → altezza da tabella (valori ridotti)
           La scelta aggiorna automaticamente il campo altezza. -->
      <div id="row-uni" class="form-group" style="display:none">
        <label>Tipo dado (UNI)</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="uni" data-val="5587">5587 Alto</button>
          <button class="toggle-btn" data-group="uni" data-val="5588">5588 Medio</button>
          <button class="toggle-btn" data-group="uni" data-val="5589">5589 Basso</button>
        </div>
      </div>

      <!-- Tipo chiave: per i metrici è unica, per i pollici
           esistono due serie (P = pesante, L = leggera) con
           misure di chiave diverse per lo stesso diametro. -->
      <div id="row-chiave-tipo" class="form-group" style="display:none">
        <label>Tipo chiave <span class="label-hint">(solo per pollici)</span></label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="chiave_tipo" data-val="p">P — pesante</button>
          <button class="toggle-btn" data-group="chiave_tipo" data-val="l">L — leggera</button>
        </div>
      </div>


      <!-- CAMPI ESCLUSIVI VITI — sopra Geometria, come row-uni per i dadi -->
      <div id="row-tipo-vite" class="form-group" style="display:none">
        <label>Tipo vite</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="tipo_vite" data-val="5737">5737 — Esag. gambo</button>
          <button class="toggle-btn"        data-group="tipo_vite" data-val="5739">5739 — Esag. tutta fil.</button>
          <button class="toggle-btn"        data-group="tipo_vite" data-val="5931">5931 — Cava (brugola)</button>
        </div>
      </div>

      <div id="row-dia-disp-viti" class="form-group" style="display:none">
        <label>Diametro barra di partenza (mm)</label>
        <input type="text" inputmode="decimal" id="dia_disp_viti" value="30">
      </div>

      <!-- TIPO PRIGIONIERO (solo modulo prigionieri)
           5909 = radice = diametro nominale (il tipo più semplice)
           5911 = radice più lunga da tabella (più avvitamento nell'impianto)
           Libero = l'utente inserisce manualmente m1 (radice) e b1 (filetto) -->
      <div id="row-tipo-prig" class="form-group" style="display:none">
        <label>Tipo prigioniero</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="tipo_prig" data-val="5909">5909</button>
          <button class="toggle-btn"        data-group="tipo_prig" data-val="5911">5911</button>
          <button class="toggle-btn"        data-group="tipo_prig" data-val="prig">Libero</button>
        </div>
      </div>
      <!-- Appare solo se tipo = libero (prig) -->
      <div id="prig-mb-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <!-- m1 = radice: il troncone che si avvita nell'impianto -->
            <label>Radice m1 (mm)</label>
            <input type="number" id="m1" value="0" min="0">
          </div>
          <div class="form-group">
            <!-- b1 = filetto: il troncone su cui va il dado -->
            <label>Filetto b1 (mm)</label>
            <input type="number" id="b1" value="0" min="0">
          </div>
        </div>
      </div>

      <!-- TIPO TIRANTE A OCCHIO
           6058 = UNI 6058 (testa standard = dian×2)
           libero = testa e foro personalizzati -->
      <div id="row-tipo-occhio" class="form-group" style="display:none">
        <label>Tipo tirante a occhio</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="tipo_occhio" data-val="6058">UNI 6058</button>
          <button class="toggle-btn"        data-group="tipo_occhio" data-val="libero">Libero</button>
        </div>
      </div>
      <!-- Diametri testa e foro personalizzati (solo se tipo = libero, e opzionali) -->
      <div id="occhio-testa-foro-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Ø testa (mm) <span class="label-hint">(0 = dian×2)</span></label>
            <input type="number" id="dia_testa_custom" value="0" min="0" step="1">
          </div>
          <div class="form-group">
            <label>Ø foro (mm) <span class="label-hint">(0 = tabella)</span></label>
            <input type="number" id="dia_foro_custom" value="0" min="0" step="1">
          </div>
        </div>
      </div>

      <!-- STAMPAGGIO TIRANTE A OCCHIO (solo occhio) -->
      <div id="row-stampaggio-occhio" class="form-group" style="display:none">
        <label>Lavorazione testa</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="stampaggio_occhio" data-val="OFF">Fresatura</button>
          <button class="toggle-btn"        data-group="stampaggio_occhio" data-val="ON">Stampaggio</button>
        </div>
      </div>

      <!-- TIRANTI: diametro medio necessario (aggiornato dinamicamente) -->
      <div id="medio-display" style="display:none; background:#162216; border:1px solid #4a7; border-radius:6px; padding:8px 12px; margin-bottom:6px; color:#8f8;">
        Diametro medio necessario: <strong id="medio-val">--</strong> mm<span id="medio-suffix"></span>
      </div>

      <!-- TIRANTI: barra a diametro medio disponibile? -->
      <div id="row-dia-disponibile" class="form-group" style="display:none">
        <label>Barra a diametro medio disponibile?</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="dia_disponibile" data-val="SI">SI</button>
          <button class="toggle-btn"        data-group="dia_disponibile" data-val="NO">NO</button>
        </div>
      </div>

      <!-- Diametro barra di partenza: per prigionieri, occhio, e tiranti quando NO -->
      <div id="row-dia-disp" class="form-group" style="display:none">
        <label>Diametro barra di partenza (mm)</label>
        <input type="text" inputmode="decimal" id="dia_disp" value="50">
      </div>

      <!-- TIRANTI: differenza rispetto al medio (appare quando dia_disponibile = NO) -->
      <div id="diff-label" style="display:none; color:#e87; font-size:0.85em; padding:2px 0 8px 6px;"></div>

      <!-- ─────────────────────────────────────────────────────
           SEZIONE GEOMETRIA
           ───────────────────────────────────────────────────── -->
      <div class="section-label">Geometria</div>

      <div class="form-row">
        <div class="form-group">
          <label>Diametro</label>
          <!-- I valori metrici sono il numero nudo (8, 10, 12...).
               I pollici usano una codifica:
               - frazioni normali per i piccoli: "3/8", "1/2"...
               - da 1" in su: "1000" = 1", "1108" = 1+1/8",
                 "1104" = 1+1/4", "2000" = 2", "2102" = 2+1/2"...
               (il codice è l'intero in pollici × 1000 + i centesimi)
               Questa codifica viene decodificata in calcolo_comune.js. -->
          <select id="dia">
            <optgroup label="Metrico">
              <option value="8">M8</option>
              <option value="10">M10</option>
              <option value="12">M12</option>
              <option value="14">M14</option>
              <option value="16">M16</option>
              <option value="18">M18</option>
              <option value="20">M20</option>
              <option value="22">M22</option>
              <option value="24">M24</option>
              <option value="27">M27</option>
              <option value="30">M30</option>
              <option value="33" selected>M33</option>
              <option value="36">M36</option>
              <option value="39">M39</option>
              <option value="42">M42</option>
              <option value="45">M45</option>
              <option value="48">M48</option>
              <option value="52">M52</option>
              <option value="56">M56</option>
              <option value="60">M60</option>
              <option value="64">M64</option>
            </optgroup>
            <optgroup label="Pollici">
              <option value="5/16">5/16"</option>
              <option value="3/8">3/8"</option>
              <option value="7/16">7/16"</option>
              <option value="1/2">1/2"</option>
              <option value="9/16">9/16"</option>
              <option value="5/8">5/8"</option>
              <option value="3/4">3/4"</option>
              <option value="7/8">7/8"</option>
              <option value="1000">1"</option>
              <option value="1108">1 1/8"</option>
              <option value="1104">1 1/4"</option>
              <option value="1308">1 3/8"</option>
              <option value="1102">1 1/2"</option>
              <option value="1508">1 5/8"</option>
              <option value="1304">1 3/4"</option>
              <option value="1708">1 7/8"</option>
              <option value="2000">2"</option>
              <option value="2104">2 1/4"</option>
              <option value="2102">2 1/2"</option>
              <option value="2304">2 3/4"</option>
              <option value="3000">3"</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>Passo</label>
          <!-- G = grosso (il passo standard, il più usato)
               F = fine (filettatura più fitta, applicazioni speciali)
               8UN / UNC / UNF = varianti per filettatura in pollici -->
          <select id="passo">
            <option value="G" selected>G — Grosso</option>
            <option value="F">F — Fine</option>
            <option value="8UN">8UN</option>
            <option value="UNC">UNC</option>
            <option value="UNF">UNF</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <!-- Lunghezza: visibile per tutti tranne i dadi
             (i dadi hanno altezza da tabella, non lunghezza) -->
        <div id="row-lungh" class="form-group">
          <label>Lunghezza (mm)</label>
          <input type="text" inputmode="decimal" id="lungh" value="100">
        </div>

        <!-- PARTE LISCIA (solo prigionieri)
             Alcuni prigionieri hanno il gambo "alleggerito": la parte
             centrale (liscia, senza filetto) è tornita a un diametro
             inferiore al nominale per ridurre peso o rigidità.
             0 = gambo normale (diametro = nominale per tutta la lunghezza) -->
        <div id="row-parte-liscia" class="form-group" style="display:none">
          <label>Ø parte liscia (mm)</label>
          <input type="number" id="parte_liscia" value="0" min="0" step="0.1">
        </div>

        <!-- Altezza dadi: visibile solo per dadi.
             Viene pre-compilata da aggiornaAltezzaDado() in base
             a tipo UNI + diametro. Modificabile a mano per dadi speciali
             (fuori standard, altezze personalizzate). -->
        <div id="row-altez" class="form-group" style="display:none">
          <label>Altezza (mm) <span class="label-hint" id="altez-hint">da tabella</span></label>
          <input type="number" id="altez_override" value="" step="0.5" placeholder="auto">
        </div>

        <!-- Qtà: accetta espressioni con somme (es. "300+240+850").
             Utile quando la commessa è fatta di più sottocommesse.
             Il JS somma i valori e mostra il totale in tempo reale.
             Classe qta-highlight = bordo giallo/oro per farlo notare. -->
        <div class="form-group qta-highlight">
          <label>Qtà totale</label>
          <input type="text" id="qta" value="30" placeholder="es. 300+240+850">
          <!-- div vuoto: il JS ci scrive il totale mentre si digita -->
          <div id="qta-preview"></div>
        </div>
      </div>

      <!-- Qtà sottocommessa: se > 0, il peso viene calcolato su questa
           quantità invece che sulla totale. Serve quando la commessa
           ha più consegne parziali e serve il peso di una sola tranche.
           Gli approntamenti (setup) rimangono divisi sulla qtà totale. -->
      <div class="form-group">
        <label>Qtà sottocommessa <span class="label-hint">(0 = usa qtà totale)</span></label>
        <input type="number" id="qta_x" value="0" min="0">
      </div>



      <!-- ─────────────────────────────────────────────────────
           SEZIONE MATERIALE
           ───────────────────────────────────────────────────── -->
      <div class="section-divider"></div>
      <div class="section-label">Materiale</div>

      <div class="form-group">
        <label>Materiale</label>
        <!-- Quando cambia la selezione, il JS aggiorna il campo
             costo_mat_override con il default di tabella. -->
        <select id="mat">
          <option value="B7" selected>B7</option>
          <option value="L7">L7</option>
          <option value="B7M">B7M</option>
          <option value="B16">B16</option>
          <option value="42CD4">42CD4</option>
          <option value="AISI 304">AISI 304</option>
          <option value="AISI 316">AISI 316</option>
          <option value="B8 cl.2">B8 cl.2</option>
          <option value="B8M cl.2">B8M cl.2</option>
          <option value="inox">Inox (generico)</option>
          <option value="altro">Altro</option>
        </select>
      </div>

      <!-- Costo materiale: prezzo netto di acquisto + ricarico %.
           Il valore finale passato ai moduli è base × (1 + ricarico/100).
           Se base = 0 (inox / altro manuale) il modulo usa la tabella. -->
      <div class="form-row">
        <div class="form-group">
          <label>Costo base (€/kg) <span class="label-hint" id="costo-mat-hint"></span></label>
          <input type="number" id="costo_mat_base" value="1.70" step="0.001" min="0">
        </div>
        <div class="form-group">
          <label>Ricarico %</label>
          <input type="number" id="costo_mat_ricarico" value="10" step="1" min="0">
        </div>
      </div>

      <!-- Gruppo "altro": appare solo se mat = "altro".
           Materiali speciali (F53, 660, 718 = leghe esotiche):
           hanno moltiplicatori sul tempo di lavorazione (2x, 3x...).
           Densità personalizzata: necessaria per il calcolo del peso
           (ogni materiale ha la sua densità in g/cm³). -->
      <div id="altro-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <!-- "0" = nessun moltiplicatore, usa solo la densità custom -->
            <label>Materiale speciale</label>
            <select id="materiale_speciale">
              <option value="0">— Generico —</option>
              <option value="F53">F53</option>
              <option value="660">660</option>
              <option value="718">718</option>
            </select>
          </div>
          <div class="form-group">
            <!-- 7.916 g/cm³ = densità acciaio inox 316, buon default -->
            <label>Densità (g/cm³)</label>
            <input type="number" id="dens_altro" value="7.916" step="0.001">
          </div>
        </div>
      </div>


      <!-- ─────────────────────────────────────────────────────
           SEZIONE OPZIONI
           Ogni campo è visibile solo per i prodotti che lo usano.
           mostraCalcolatore() gestisce show/hide al cambio prodotto.
           ───────────────────────────────────────────────────── -->
      <div class="section-divider"></div>
      <div class="section-label">Opzioni</div>

      <!-- PRIGIONIERO (solo tiranti semplici)
           Quando è ON, il tirante ha due lunghezze di filetto diverse
           sui due lati (fil_a e fil_b). Cambia il calcolo della rullatura. -->
      <div id="row-prigioniero" class="form-group">
        <label>Prigioniero</label>
        <div class="toggle-group">
          <!-- data-group: identifica il gruppo — un solo bottone per
               gruppo può essere "active" (attivo) alla volta.
               data-val: il valore che getToggleVal() restituirà. -->
          <button class="toggle-btn active" data-group="prigioniero" data-val="OFF">OFF</button>
          <button class="toggle-btn"        data-group="prigioniero" data-val="ON">ON</button>
        </div>
      </div>
      <!-- Appare solo se prigioniero = ON -->
      <div id="prigioniero-group" style="display:none">
        <div class="form-row">

      <!-- FANTINA (torniti e prigionieri)
           La fantina è un dispositivo di bloccaggio pezzo al tornio.
           Con fantina attiva:
           - tempo tornitura dimezzato (il pezzo è già centrato)
           - niente taglio (si parte dal pezzo finito sui lati)
           - setup più lungo (7200s invece di 3600s) -->
      <div id="row-fantina" class="form-group" style="display:none">
        <label>Fantina</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="fantina" data-val="OFF">OFF</button>

      </div>

      <!-- BARRA GIUSTA (torniti e prigionieri)
           Normalmente il costo materiale = peso pezzo × €/kg.
           Con barra giusta si paga l'intera barra perché è una misura
           speciale non riutilizzabile (es. barra da 1.2 metri per un

      <div id="row-barra-giusta" class="form-group" style="display:none">

        <div class="toggle-group">

      </div>



      <!-- MARCATURA COMPLESSA (tiranti, prigionieri, dadi)
           Se ON: tempo marcatura 50s, setup 600s.
           Se OFF: 10s (lungh ≤ 300) o 20s (lungh > 300), setup 150s. -->
      <div id="row-marcatura-complessa" class="form-group" style="display:none">

      <!-- MINORATO (tutti tranne dadi)
           Riduce il diametro medio usato nei calcoli di tornitura/rullatura.

      <div id="row-minorato" class="form-group" style="display:none">
        <label>Minorato</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="minorato" data-val="OFF">OFF</button>
          <button class="toggle-btn"        data-group="minorato" data-val="ON">ON</button>

      </div>
      <!-- Appare solo se minorato = ON -->
      <div id="minorato-group" style="display:none">

      <div id="row-lav-vite" class="form-group" style="display:none">

        <div class="toggle-group">

      <div id="row-trattamento-vite" class="form-group" style="display:none">
        <label>Trattamento termico</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="trattamento_vite" data-val="OFF">OFF</button>
          <button class="toggle-btn"        data-group="trattamento_vite" data-val="ON">ON</button>
        </div>
      </div>
      <!-- Appare solo se trattamento_vite = ON -->
      <div id="trattamento-vite-group" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>Costo trattamento (€/kg)</label>
            <input type="number" id="costo_bonifica_kg" value="1.20" step="0.01">
          </div>
          <div class="form-group">
            <label>Forfait minimo (€)</label>
            <input type="number" id="forfait_bonifica" value="400" step="10">
          </div>
        </div>
      </div>

      <div id="row-tf-vite" class="form-group" style="display:none">
        <label>Filettatura totale <span class="label-hint">(ignora tabella)</span></label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="tf_vite" data-val="OFF">OFF</button>
          <button class="toggle-btn"        data-group="tf_vite" data-val="ON">ON</button>
        </div>
      </div>

      <div id="row-filetto-vite" class="form-group" style="display:none">
        <label>Lunghezza filetto (mm) <span class="label-hint">(0 = da tabella)</span></label>
        <input type="number" id="filetto_vite" value="0" min="0" step="1">
      </div>

      <div id="row-dpl-vite" class="form-group" style="display:none">

        <input type="number" id="dpl_vite" value="0" min="0" step="0.1">
      </div>


      <!-- LAVORAZIONE DADI: fresatura o stampaggio (si escludono)
           Fresatura  = si parte da un tondo più grande dello spigolo,
                        si fresa l'esagono (materiale = peso cilindro)
           Stampaggio = si parte da un tondo più piccolo della chiave,
                        si stampa l'esagono (formula materiale diversa) -->
      <div id="row-stampaggio" class="form-group" style="display:none">

          <button class="toggle-btn"        data-group="stampaggio" data-val="ON">Stampaggio</button>
        </div>
      </div>

      <!-- TRATTAMENTO TERMICO (solo dadi)
           Costo aggiuntivo: peso_finito × prezzo_kg.
           Ha un forfait minimo: se il totale della partita è sotto
           soglia, si usa forfait/qta come costo unitario. -->
      <div id="row-trattamento" class="form-group" style="display:none">
        <label>Trattamento termico</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-group="trattamento" data-val="OFF">OFF</button>

      <!-- Appare solo se trattamento = ON -->

            <label>Prezzo €/kg</label>
            <input type="number" id="prezzo_kg" value="1.2" step="0.1">

          <div class="form-group">
            <label>Forfait minimo (€)</label>
            <input type="number" id="forfait" value="400" step="10">
          </div>
        </div>
      </div>


      <!-- ─────────────────────────────────────────────────────
           COSTI BASE
           co1 = €/secondo per diametri piccoli (< 45mm)
           co2 = €/secondo per diametri grandi (≥ 45mm)
           Tutti i tempi di lavorazione (in secondi) vengono
           moltiplicati per co1 o co2 per ottenere il costo.
           Esempio: 120s × 0.018 €/s = 2.16 €
           Modificabili dall'utente per aggiustare i prezzi
           senza toccare le tabelle JSON.
           ───────────────────────────────────────────────────── -->
      <div class="section-divider"></div>
      <div class="section-label">Costi base (€/s)</div>
      <div class="form-row">
        <div class="form-group">
          <label>Co1 — piccolo diam.</label>
          <input type="number" id="co1" value="0.018" step="0.001">

        <div class="form-group">

      <!-- onclick chiama window.calcola() — definito nello script -->
      <button class="calc-btn" onclick="calcola()">⬡ CALCOLA</button>

    </div><!-- fine .inputs-panel -->


    <!-- ═══════════════════════════════════════════════════════
         PANNELLO RISULTATI
         All'avvio mostra il messaggio vuoto.

    <div class="results-panel" id="results">
      <div class="results-empty">

  </div><!-- fine .main -->

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT — type="module"
     Il tipo "module" abilita:
     - import/export (sistema modulare ES6)
     - scope isolato (le variabili non "inquinano" il namespace globale)

     ATTENZIONE: i moduli non funzionano aprendo il file con
     file:// nel browser (blocco CORS). Servono:
     - Live Server in VS Code (sviluppo locale)
     - GitHub Pages o altro server web (produzione)
     ═══════════════════════════════════════════════════════════ -->
<script type="module">

// ─── IMPORT ──────────────────────────────────────────────────
// Ogni modulo esporta la sua funzione di calcolo principale.
// Aggiungere un nuovo modulo = aggiungere una riga qui + un branch
// in calcola() + la logica in renderResults().
import { calcolaTiranti }     from './moduli/tiranti_unificato.js';
import { calcolaDadi }        from './moduli/dadi.js';
import { calcolaPrigionieri } from './moduli/prigionieri.js';
import { parseDia, parseExpr, getDiametroMedio } from './lib/calcolo_comune.js';
// tiranti_occhio.js viene importato dinamicamente in calcola()
// per evitare che un file mancante blocchi l'intera applicazione


// ─── CARICAMENTO TABELLE JSON ─────────────────────────────────
// I dati (prezzi, tempi, dimensioni) sono in file JSON separati.
// Separare i dati dal codice è buona pratica: si aggiornano i
// prezzi senza toccare la logica, e viceversa.
//
// Promise.all([...]) carica i tre file IN PARALLELO:
// più veloce che caricarli uno alla volta in sequenza.
// Quando TUTTI sono pronti, esegue .then([a, b, c] => ...).
//
// I file vengono "parsati" automaticamente con .json()
// (convertiti da testo JSON a oggetto JavaScript).
//
// T, TD, TP partono null — calcola() li controlla prima di usarli
// per evitare errori se si clicca CALCOLA troppo presto.

let T  = null;   // comune.json      — dati condivisi tra tutti i moduli
let TD = null;   // dadi.json        — tabelle specifiche per i dadi
let TP = null;   // prigionieri.json — tabelle specifiche per i prigionieri
let TV = null;   // viti.json        — tabelle specifiche per le viti

Promise.all([
  fetch('./tabelle/comune.json').then(r => r.json()),
  fetch('./tabelle/dadi.json').then(r => r.json()),
  fetch('./tabelle/prigionieri.json').then(r => r.json()),
  fetch('./tabelle/viti.json').then(r => r.json()),
]).then(([comune, dadi, prig, viti]) => {
  T  = comune;
  TD = dadi;
  TP = prig;
  TV = viti;
}).catch(() => { alert('Errore: impossibile caricare le tabelle JSON'); });


// ─── STATO ───────────────────────────────────────────────────
// Teniamo traccia di quale prodotto è attivo in questa variabile.
// null = siamo nella schermata di selezione.
let prodottoCorrente = null;


// ─── SELETTORE PRODOTTO ───────────────────────────────────────
// querySelectorAll restituisce tutti i bottoni attivi (non disabled).
// Per ognuno aggiungiamo un listener: alla pressione salva il prodotto
// e mostra il calcolatore appropriato.
document.querySelectorAll('.product-btn:not(.disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    prodottoCorrente = btn.dataset.product; // legge data-product="..."
    mostraCalcolatore(prodottoCorrente);
  });
});


// ─── MOSTRA CALCOLATORE ───────────────────────────────────────
// Chiamata quando l'utente sceglie un prodotto.
// 1. Nasconde il selettore, mostra il calcolatore
// 2. Aggiorna header con nome e descrizione prodotto
// 3. Mostra/nasconde i campi specifici per quel prodotto
// 4. Se dadi: aggiorna subito il campo altezza
// 5. Resetta il pannello risultati
function mostraCalcolatore(prodotto) {
  document.getElementById('product-selector').style.display = 'none';
  document.getElementById('calculator').style.display = 'block';

  // Flag booleani — rendono il codice più leggibile di
  // confrontare la stringa prodotto ovunque
  const isDadi        = prodotto === 'dadi';
  const isTiranti     = prodotto === 'tiranti';
  const isPrigionieri = prodotto === 'prigionieri';
  const isOcchio      = prodotto === 'tiranti_occhio';
  const isViti        = prodotto === 'viti';

  // Aggiorna testi header
  const titoli = {
    tiranti:        'Tiranti',
    dadi:           'Dadi',
    prigionieri:    'Prigionieri',
    tiranti_occhio: 'Tiranti a Occhio',
    viti:           'Viti',
  };
  const subs = {
    tiranti:        'Da barra a diametro medio o superiore',
    dadi:           'UNI 5587 / 5588 / 5589',
    prigionieri:    'UNI 5909 / 5911 / libero',
    tiranti_occhio: 'UNI 6058 / libero',
    viti:           'UNI 5737 / 5739 / 5931',
  };
  document.getElementById('header-title').textContent = titoli[prodotto] || prodotto;
  document.getElementById('header-sub').textContent   = subs[prodotto]   || '';

  // Funzione locale: mostra o nasconde un elemento per id.
  // Creata qui dentro perché serve solo in questa funzione.
  const show = (id, visible) => {
    const el = document.getElementById(id);
    if (el) el.style.display = visible ? 'block' : 'none';
  };

  // Nascondi tutti i gruppi condizionali prima di tutto — così cambiare
  // prodotto non lascia campi "orfani" visibili dallo stato precedente.
  show('prig-mb-group',          false);
  show('prigioniero-group',      false);
  show('lungh-barra-group',      false);
  show('trattamento-group',      false);
  show('trattamento-vite-group', false);
  show('occhio-testa-foro-group',false);

  // Reset campi principali ai valori di default
  document.getElementById('dia').value   = '33';
  document.getElementById('passo').value = 'G';
  document.getElementById('lungh').value = '100';
  document.getElementById('qta').value   = '30';
  document.getElementById('qta_x').value = '0';

  // Reset toggle: rimuovi active da tutti, rimettilo solo sul primo di ogni gruppo
  const seenGroups = new Set();
  document.querySelectorAll('.toggle-btn').forEach(b => seenGroups.add(b.dataset.group));
  seenGroups.forEach(g => {
    document.querySelectorAll(`.toggle-btn[data-group="${g}"]`)
      .forEach((b, i) => b.classList.toggle('active', i === 0));
  });

  // Ogni riga ha una condizione che determina se è visibile.
  // Leggi come: "mostra lungh se NON sono i dadi", ecc.
  show('row-lungh',        !isDadi);                    // lunghezza: tutti tranne dadi
  show('row-altez',         isDadi);                    // altezza auto: solo dadi
  show('row-dia-disp',      isPrigionieri || isOcchio);             // barra di partenza: prigionieri, occhio (tiranti: gestito da toggle)
  // Campi esclusivi viti
  show('row-tipo-vite',     isViti);
  show('row-lav-vite',      isViti);
  show('row-trattamento-vite', isViti);
  show('row-tf-vite',       isViti);
  show('row-filetto-vite',  isViti);
  show('row-dpl-vite',      isViti);
  show('row-dia-disp-viti', isViti);
  show('row-prigioniero',   isTiranti);                 // opzione prigioniero: solo tiranti
  show('row-fantina',       isPrigionieri);             // fantina: prigionieri (tiranti: gestito da toggle)
  show('row-barra-giusta',  isPrigionieri);             // barra giusta: prigionieri (tiranti: gestito da toggle)
  show('row-tipo-prig',     isPrigionieri);             // tipo UNI: solo prigionieri
  show('row-parte-liscia',  isPrigionieri);             // gambo alleggerito: solo prigionieri
  show('row-tipo-occhio',   isOcchio);                  // tipo 6058/libero: solo occhio
  show('row-stampaggio-occhio', isOcchio);              // fresatura/stampaggio testa: solo occhio
  show('row-uni',           isDadi);                    // tipo UNI dado: solo dadi
  show('row-chiave-tipo',   isDadi || isViti);            // serie chiave: dadi + viti pollici
  aggiornaChiaveTipo();
  show('row-dia-disp-dadi', isDadi);                    // barra grezza dadi: solo dadi
  show('row-stampaggio',    isDadi);                    // fresatura/stampaggio: solo dadi
  show('row-trattamento',   isDadi || isTiranti || isPrigionieri || isOcchio); // trattamento termico: tutti tranne viti
  show('medio-display',      isTiranti);                // info diametro medio: solo tiranti
  show('row-dia-disponibile', isTiranti);               // toggle barra disponibile: solo tiranti
  show('row-marcatura-complessa', isTiranti || isPrigionieri || isDadi || isOcchio); // marcatura complessa: tiranti, prigionieri, dadi, occhio
  show('row-minorato',           !isDadi);                    // minorato: tutti tranne dadi

  // Per i dadi calcola subito l'altezza di default
  if (isDadi) aggiornaAltezzaDado();
  // Nascondi sempre i gruppi condizionali al reset
  document.getElementById('minorato-group').style.display = 'none';

  // Per i tiranti resetta il toggle a SI e aggiorna il display medio
  if (isTiranti) {
    document.querySelectorAll('.toggle-btn[data-group="dia_disponibile"]')
      .forEach(b => b.classList.toggle('active', b.dataset.val === 'SI'));
    aggiornaMedio();
  }

  // Reset risultati
  document.getElementById('results').innerHTML = `
    <div class="results-empty">
      <div class="big-icon">⬡</div>
      <div>Inserisci i parametri e premi CALCOLA</div>
    </div>`;
}


// ─── TORNA AL SELETTORE ───────────────────────────────────────
// Su window perché viene chiamata da onclick nell'HTML.
// I module script hanno scope chiuso: senza window.xxx,
// il codice HTML non potrebbe trovare la funzione.
window.tornaAlSelettore = function() {
  document.getElementById('calculator').style.display = 'none';
  document.getElementById('product-selector').style.display = 'block';
  document.getElementById('header-title').textContent = 'Preventivi';
  document.getElementById('header-sub').textContent = 'Seleziona un prodotto';
  prodottoCorrente = null;
};


// ─── TOGGLE BUTTONS ───────────────────────────────────────────
// Logica comune a tutti i toggle button:
// - Ogni gruppo (data-group) può avere un solo bottone attivo
// - La classe CSS "active" lo fa sembrare selezionato
// - Alcuni toggle aprono/chiudono campi dipendenti
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;

    // Deseleziona tutto il gruppo, poi seleziona solo questo
    document.querySelectorAll(`.toggle-btn[data-group="${group}"]`)
      .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Campi che compaiono/scompaiono in base al valore selezionato:

    // prigioniero = ON → mostra lunghezze filetto A e B
    if (group === 'prigioniero') {
      document.getElementById('prigioniero-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
    // barra_giusta = ON → mostra lunghezza barra
    if (group === 'barra_giusta') {
      document.getElementById('lungh-barra-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
    // trattamento = ON → mostra prezzo kg e forfait
    if (group === 'trattamento') {
      document.getElementById('trattamento-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
    // tipo_occhio = libero → mostra campi testa e foro
    if (group === 'tipo_occhio') {
      document.getElementById('occhio-testa-foro-group').style.display =
        btn.dataset.val === 'libero' ? 'block' : 'none';
    }
    // tipo_prig = libero → mostra campi m1/b1 manuali
    if (group === 'tipo_prig') {
      document.getElementById('prig-mb-group').style.display =
        btn.dataset.val === 'prig' ? 'block' : 'none';
    }
    // trattamento_vite = ON → mostra costo kg e forfait
    if (group === 'trattamento_vite') {
      document.getElementById('trattamento-vite-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
    }
    // viti: fresa = mostra dia_disp_viti, filetto, dpl
    if (group === 'lav_vite') {
      const isFresa = btn.dataset.val === 'fresa';
      document.getElementById('row-dia-disp-viti').style.display = 'block'; // sempre
      // con fresa mostra anche filetto e parte liscia
      document.getElementById('row-filetto-vite').style.display = 'block';
      document.getElementById('row-dpl-vite').style.display = 'block';
    }
    // dia_disponibile: SI = barra a diametro medio, NO = inserisci diametro manuale
    if (group === 'dia_disponibile') {
      const isNO = btn.dataset.val === 'NO';
      document.getElementById('row-dia-disp').style.display     = isNO ? 'block' : 'none';
      document.getElementById('diff-label').style.display       = isNO ? 'block' : 'none';
      document.getElementById('row-fantina').style.display      = isNO ? 'block' : 'none';
      document.getElementById('row-barra-giusta').style.display = isNO ? 'block' : 'none';
      if (isNO) {
        const medioVal = parseFloat(document.getElementById('medio-val').textContent);
        const input = document.getElementById('dia_disp');
        if (!isNaN(medioVal)) {
          input.placeholder = medioVal.toFixed(2);
          if (!input.value || parseFloat(input.value) <= medioVal) {
            input.value = '';
          }
        }
        aggiornaDiffLabel();
      }
    }
    // minorato: ON → mostra campo riduzione; aggiorna display medio
    if (group === 'minorato') {
      document.getElementById('minorato-group').style.display =
        btn.dataset.val === 'ON' ? 'block' : 'none';
      aggiornaMedio();
    }
  });
});


// ─── DIAMETRO MEDIO TIRANTI ───────────────────────────────────
// Aggiorna il display del diametro medio necessario e il placeholder
// di dia_disp al cambio di diametro o passo, solo per i tiranti.
function aggiornaMedio() {
  if (prodottoCorrente !== 'tiranti') return;
  try {
    const diam_raw = getDiametroMedio(T, parseDia(getStr('dia')), getStr('passo'));
    const minorato = getToggleVal('minorato') === 'ON';
    const riduzione = minorato ? getNum('riduzione_medio', 0.4) : 0;
    const diam_eff = diam_raw - riduzione;
    document.getElementById('medio-val').textContent = diam_eff.toFixed(2);
    document.getElementById('medio-suffix').textContent = minorato ? ' (minorato)' : '';
    const input = document.getElementById('dia_disp');
    input.placeholder = diam_eff.toFixed(2);
    if (getToggleVal('dia_disponibile') === 'NO') aggiornaDiffLabel();
  } catch(e) { /* dia/passo non ancora disponibili */ }
}

// ricarico = % da applicare (10 per quasi tutti, 15 per 42CD4, 20 per inox)
const COSTO_DEFAULT = {
  B7:          { base: 1.60, ricarico:  0, hint: '' },
  L7:          { base: 1.70, ricarico:  0, hint: '' },
  B7M:         { base: 1.65, ricarico:  0, hint: '' },
  B16:         { base: 2.00, ricarico:  0, hint: '' },
  '42CD4':     { base: 1.60, ricarico:  0, hint: '' },
  'AISI 304':  { base: 4.00, ricarico: 10, hint: '' },
  'AISI 316':  { base: 5.20, ricarico: 10, hint: '' },
  'B8 cl.2':   { base: 4.20, ricarico: 10, hint: '' },
  'B8M cl.2':  { base: 5.40, ricarico: 10, hint: '' },
  inox:        { base: 0,    ricarico: 10, hint: 'inserire manualmente' },
  altro:       { base: 0,    ricarico: 10, hint: 'inserire manualmente' },
};

document.getElementById('mat').addEventListener('change', function() {

    document.querySelectorAll(`.toggle-btn[data-group="${group}"]`)
      .forEach(b => b.classList.toggle('active', b.dataset.val === 'ON'));

  }
});


// ─── PREVIEW QUANTITÀ ────────────────────────────────────────
// Mostra il totale mentre si digita, quando c'è un + nella qtà.
// Accetta solo cifre, spazi e +; tutto il resto → "formato non valido".
function parseQtaUI(raw) {
  const s = String(raw).trim();
  // Regex: accetta solo cifre (\d), spazi (\s) e +
  if (!/^[\d\s+]+$/.test(s)) return NaN;
  const parts = s.split('+').map(p => parseInt(p.trim(), 10));
  if (parts.some(isNaN)) return NaN;
  // reduce somma tutti gli elementi dell'array: [300, 240, 850] → 1390
  return parts.reduce((a, b) => a + b, 0);
}

document.getElementById('qta').addEventListener('input', function() {
  const preview = document.getElementById('qta-preview');
  if (this.value.includes('+')) {
    const tot = parseQtaUI(this.value);
    preview.textContent = isNaN(tot) ? '⚠ formato non valido' : `= ${tot}`;
  } else {
    preview.textContent = '';
  }
});


// ─── AGGIORNA ALTEZZA DADO ────────────────────────────────────
// Riempie automaticamente il campo altezza quando cambia
// il tipo UNI o il diametro (solo per il modulo dadi).
//
// Logica: legge dia e uni selezionati → cerca l'altezza nelle
// tabelle TD già caricate → scrive il valore nel campo.
// Se il diametro non è in tabella → svuota il campo + avviso.
//
// L'utente può sempre sovrascrivere manualmente il valore
// (per dadi fuori standard o con altezze personalizzate).
function aggiornaAltezzaDado() {
  if (prodottoCorrente !== 'dadi' || !TD) return;

  const dia = getStr('dia');
  const uni = getToggleVal('uni');

  // Diametro nominale: per metrici è il numero stesso.
  // Per i pollici, prova a leggerlo dalla tabella in comune.json.
  // L'operatore ?. (optional chaining) evita errori se T è ancora null.
  // L'operatore ?? (nullish coalescing) usa parseFloat come fallback.
  const dian = T?.diametri_nominali_pollici?.[dia] ?? parseFloat(dia);

  let altez = null;
  if      (uni === '5587') altez = dian;                            // UNI alto: altezza = nominale
  else if (uni === '5588') altez = TD.altezze_5588[String(dia)] ?? null;
  else if (uni === '5589') altez = TD.altezze_5589[String(dia)] ?? null;

  const input = document.getElementById('altez_override');
  const hint  = document.getElementById('altez-hint');

  if (altez !== null) {
    input.value = altez;
    hint.textContent = 'da tabella';
  } else {
    input.value = '';
    hint.textContent = '⚠ inserire manualmente';
  }
}

// Aggancia la funzione ai due eventi che la fanno scattare
document.getElementById('dia').addEventListener('change', aggiornaAltezzaDado);
document.querySelectorAll('.toggle-btn[data-group="uni"]').forEach(btn => {
  // setTimeout(..., 0): aspetta che il click del toggle finisca
  // (e che "active" sia già aggiornato) prima di leggere il valore.
  // Senza di questo, leggerebbe ancora il valore del bottone precedente.
  btn.addEventListener('click', () => setTimeout(aggiornaAltezzaDado, 0));
});


// ─── HELPER: LETTURA CAMPI ────────────────────────────────────
// Funzioni di comodo per non ripetere document.getElementById
// ogni volta in calcola(). Rendono il codice molto più leggibile.

// Legge un numero; se il campo è vuoto/invalido restituisce il default
function getNum(id, def = 0) {
  const v = parseExpr(document.getElementById(id)?.value);
  return isNaN(v) ? def : v;
}

// Legge una stringa (es. il valore di una select)
function getStr(id) {

}

// Legge il valore del bottone toggle attivo in un gruppo
// (restituisce la stringa data-val: 'OFF', 'ON', '5909', ecc.)
function getToggleVal(group) {
  return document.querySelector(`.toggle-btn.active[data-group="${group}"]`)
    ?.dataset.val || '';

// Versione booleana di getToggleVal: true se data-val === 'ON'
function getToggle(group) {

// ─── CALCOLA ─────────────────────────────────────────────────
// Funzione principale — chiamata dal bottone CALCOLA.
// Su window per essere accessibile dall'onclick nell'HTML.
//
// Flusso:
// 1. Controlla che le tabelle JSON siano pronte
// 2. Scrive i costi base (co1, co2) nell'oggetto T
// 3. Raccoglie tutti gli input con le funzioni helper
// 4. Eventuale validazione specifica (es. dadi: dia_disp vs chiave)
// 5. Chiama il modulo giusto → ottiene R (oggetto risultati)
// 6. Passa R a renderResults()
// In caso di errore: mostra il messaggio nel pannello risultati
// invece di far crashare silenziosamente.
window.calcola = async function() {
  if (!T || !TD || !TP || !TV) {
    alert('Tabelle non ancora caricate, riprova tra un secondo.');
    return;
  }

  try {
    // I co1/co2 letti dall'UI sovrascrivono quelli del JSON in memoria.
    // Tutti i moduli leggono da T.costi_base, quindi basta aggiornarli qui.
    T.costi_base.co1 = getNum('co1', 0.018);
    T.costi_base.co2 = getNum('co2', 0.022);

    let R; // R = oggetto risultati restituito dal modulo

    if (prodottoCorrente === 'tiranti') {
      // ── Tiranti (unificato: senza o con tornitura) ────────
      const dia_raw  = getStr('dia');
      const passo    = getStr('passo');
      const diam     = getDiametroMedio(T, parseDia(dia_raw), passo);
      const minorato = getToggleVal('minorato') === 'ON';
      const riduzione = minorato ? getNum('riduzione_medio', 0.4) : 0;
      const medio_override = minorato ? diam - riduzione : 0;
      const diaIsNO  = getToggleVal('dia_disponibile') === 'NO';
      const diaDisp  = diaIsNO ? getNum('dia_disp', medio_override || diam) : (medio_override || diam);

      R = calcolaTiranti({
        dia_raw, passo,
        lungh_raw:          getNum('lungh', 100),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_base', 0) * (1 + getNum('costo_mat_ricarico', 10) / 100),
        PRIGIONIERO:        getToggle('prigioniero'),
        fil_a:              getNum('fil_a', 25),
        fil_b:              getNum('fil_b', 25),
        dia_disp:           diaDisp,
        FANTINA:            diaIsNO ? getToggle('fantina')      : false,
        BARRA_GIUSTA:       diaIsNO ? getToggle('barra_giusta') : false,
        lungh_barra:        getNum('lungh_barra', 3000),
        marcatura_complessa: getToggle('marcatura_complessa'),
        medio_override,
      }, T);
      if (getToggle('trattamento')) {
        const tratt = Math.max(R.peso * getNum('prezzo_kg', 1.2), getNum('forfait', 400) / R.qta);
        R.trattamento = tratt;
        R.costo_tot += tratt;
        R.costo_lav += tratt;
      }

    } else if (prodottoCorrente === 'prigionieri') {
      // ── Prigionieri ───────────────────────────────────────
      const _diam_p  = getDiametroMedio(T, parseDia(getStr('dia')), getStr('passo'));
      const _min_p   = getToggleVal('minorato') === 'ON';
      const medio_override = _min_p ? _diam_p - getNum('riduzione_medio', 0.4) : 0;
      R = calcolaPrigionieri({
        tipo:               getToggleVal('tipo_prig'),
        dia_raw:            getStr('dia'),
        passo:              getStr('passo'),
        lungh_raw:          getNum('lungh', 100),
        parte_liscia:       getNum('parte_liscia', 0),
        m1:                 getNum('m1', 0),
        b1:                 getNum('b1', 0),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_base', 0) * (1 + getNum('costo_mat_ricarico', 10) / 100),
        dia_disp:           getNum('dia_disp', 16),
        FANTINA:            getToggle('fantina'),
        BARRA_GIUSTA:       getToggle('barra_giusta'),
        lungh_barra:        getNum('lungh_barra', 3000),
        marcatura_complessa: getToggle('marcatura_complessa'),
        medio_override,
      }, T, TP);
      if (getToggle('trattamento')) {
        const tratt = Math.max(R.peso * getNum('prezzo_kg', 1.2), getNum('forfait', 400) / R.qta);
        R.trattamento = tratt;
        R.costo_tot += tratt;
        R.costo_lav += tratt;
      }

    } else if (prodottoCorrente === 'dadi') {
      // ── Dadi — validazione prima del calcolo ──────────────
      // Il diametro della barra grezza deve essere compatibile
      // con la lavorazione scelta, per ragioni geometriche:
      //
      // FRESATURA: si ricava l'esagono da un tondo.
      //   Il tondo deve essere almeno grande quanto lo spigolo
      //   dell'esagono (la distanza tra vertici opposti).
      //   Spigolo = chiave × 1.154 (chiave / cos30°)
      //   Se il tondo è più piccolo → non c'è materiale sufficiente.
      //
      // STAMPAGGIO: il tondo viene stampato nella forma esagonale.
      //   Deve entrare nella matrice → deve essere < chiave.
      //   Se è troppo grande → non entra nello stampo.

      const _diaDisp = getNum('dia_disp_dadi', 60);
      const _dia     = getStr('dia');
      // Cerca la chiave nelle tabelle: prima metrici, poi pollici P, poi L
      const _chiave  = TD.chiavi_metriche[_dia]
                    ?? TD.chiavi_pollici_p[_dia]
                    ?? TD.chiavi_pollici_l[_dia];

      if (_chiave) {
        const _spigolo = _chiave * 1.154; // distanza vertice-vertice esagono
        const _stamp   = getToggle('stampaggio');

        if (!_stamp && _diaDisp < _spigolo) {
          alert(`⚠ Diametro barra (${_diaDisp} mm) inferiore allo spigolo (${_spigolo.toFixed(1)} mm).\nPer fresare devi partire da un tondo più grosso.`);
          return; // blocca il calcolo
        }
        if (_stamp && _diaDisp >= _chiave) {
          alert(`⚠ Diametro barra (${_diaDisp} mm) superiore alla chiave (${_chiave} mm).\nPer stampare devi partire da un tondo più piccolo della chiave.`);
          return; // blocca il calcolo
        }
      }

      R = calcolaDadi({
        UNI:                 getToggleVal('uni'),
        dia_raw:             getStr('dia'),
        passo:               getStr('passo'),
        chiave_tipo:         getToggleVal('chiave_tipo'),
        altez_override:      getNum('altez_override', 0),
        qta_raw:             getStr('qta'),
        qta_x:               getNum('qta_x', 0),
        mat:                 getStr('mat'),
        materiale_speciale:  getStr('materiale_speciale'),
        dens_altro:          getNum('dens_altro', 7.916),
        costo_mat_override:  getNum('costo_mat_base', 0) * (1 + getNum('costo_mat_ricarico', 10) / 100),
        dia_disp:            getNum('dia_disp_dadi', 60),
        STAMPAGGIO:          getToggle('stampaggio'),
        TRATTAMENTO_TERMICO: getToggle('trattamento'),
        prezzo_kg:           getNum('prezzo_kg', 1.2),
        forfait:             getNum('forfait', 400),
        marcatura_complessa: getToggle('marcatura_complessa'),
      }, T, TD);
    } else if (prodottoCorrente === 'tiranti_occhio') {
      // ── Tiranti a Occhio — import dinamico ───────────────
      const { calcolaTirantiOcchio } = await import('./moduli/tiranti_occhio.js');
      const _diam_o  = getDiametroMedio(T, parseDia(getStr('dia')), getStr('passo'));
      const _min_o   = getToggleVal('minorato') === 'ON';
      const medio_override = _min_o ? _diam_o - getNum('riduzione_medio', 0.4) : 0;
      R = calcolaTirantiOcchio({
        tipo:               getToggleVal('tipo_occhio'),
        dia_raw:            getStr('dia'),
        passo:              getStr('passo'),
        lungh_raw:          getNum('lungh', 100),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_base', 0) * (1 + getNum('costo_mat_ricarico', 10) / 100),
        dia_testa_custom:   getNum('dia_testa_custom', 0),
        dia_foro_custom:    getNum('dia_foro_custom', 0),
        dia_disp:           getNum('dia_disp', 50),
        STAMPAGGIO:         getToggle('stampaggio_occhio'),
        medio_override,
      }, T);
      if (getToggle('trattamento')) {
        const tratt = Math.max(R.peso * getNum('prezzo_kg', 1.2), getNum('forfait', 400) / R.qta);
        R.trattamento = tratt;
        R.costo_tot += tratt;
        R.costo_lav += tratt;
      }
    }

    // ── Viti ─────────────────────────────────────────────
    if (prodottoCorrente === 'viti') {
      const { calcolaViti } = await import('./moduli/viti.js');
      const _diam_v  = getDiametroMedio(T, parseDia(getStr('dia')), getStr('passo'));
      const _min_v   = getToggleVal('minorato') === 'ON';
      const medio_override = _min_v ? _diam_v - getNum('riduzione_medio', 0.4) : 0;
      R = calcolaViti({
        tipo:               getToggleVal('tipo_vite'),
        dia_raw:            getStr('dia'),
        passo:              getStr('passo'),
        lungh_raw:          getNum('lungh', 100),
        qta_raw:            getStr('qta'),
        qta_x:              getNum('qta_x', 0),
        mat:                getStr('mat'),
        materiale_speciale: getStr('materiale_speciale'),
        dens_altro:         getNum('dens_altro', 7.916),
        costo_mat_override: getNum('costo_mat_base', 0) * (1 + getNum('costo_mat_ricarico', 10) / 100),
        dia_disp_raw:       getNum('dia_disp_viti', 30),
        TF:                 getToggle('tf_vite'),
        filetto_override:   getNum('filetto_vite', 0),
        dia_parte_liscia:   getNum('dpl_vite', 0),
        chiave_tipo:        getToggleVal('chiave_tipo'),
        STAMPAGGIO:         getToggleVal('lav_vite') === 'stamp',
        TRATTAMENTO:        getToggle('trattamento_vite'),
        costo_bonifica_kg:  getNum('costo_bonifica_kg', 1.20),
        forfait_bonifica:   getNum('forfait_bonifica', 400),
        medio_override,
      }, T, TV);
    }

    renderResults(R);

  } catch(e) {
    // Mostra l'errore nel pannello invece di far crashare.
    // Gli errori tipici: diametro fuori range, combinazione
    // dia/passo non in tabella, calcolo geometrico impossibile.
    document.getElementById('results').innerHTML =
      `<div class="error-msg">⚠ ERRORE: ${e.message}</div>`;
  }
};


// ─── UTILITY: FORMATTAZIONE NUMERO ───────────────────────────
// r(n, d) → stringa con d decimali, oppure "—" se n non è un numero.
// Usata ovunque nei template HTML.
// Esempi: r(1.2345) → "1.23"   r(0.018, 3) → "0.018"   r(undefined) → "—"
function r(n, d = 2) {
  return (typeof n === 'number' && !isNaN(n)) ? n.toFixed(d) : '—';
}


// ─── RENDER RISULTATI ────────────────────────────────────────
// Riceve l'oggetto R (risultati dal modulo) e costruisce l'HTML.
//
// Usa template literals (backtick `...`) per costruire HTML
// con valori dinamici tramite ${...}.
//
// Struttura output:
//   1. Card principale: costo totale
//   2. Griglia: dettaglio voce per voce
//   3. Grafico a barre: composizione visiva del costo
//   4. Card geometria: (solo dadi e prigionieri)
//   5. Card barre: (solo con BARRA_GIUSTA)
//   6. Card tempi: secondi per voce + stringa gestionale
//   7. Card peso: peso singolo, lotto, modificatore
function renderResults(R) {
  const panel     = document.getElementById('results');
  const isTornito = R.ha_tornitura === true;
  const isDadi    = prodottoCorrente === 'dadi';
  const isPrig    = prodottoCorrente === 'prigionieri';
  const isOcchio  = prodottoCorrente === 'tiranti_occhio';
  const isViti    = prodottoCorrente === 'viti';

  // ── Funzione bar(): riga del grafico a barre ──────────────
  // pct: percentuale rispetto al costo totale
  //      Math.max(2, ...) garantisce almeno 2% di larghezza
  //      per visibilità anche per voci molto piccole
  // cls: classe CSS per il colore (mat, torn, taglio, ecc.)
  function bar(label, val, cls) {
    const _tot = R.costo_tot ?? R.totale ?? 1;
    const pct = _tot > 0 ? Math.max(2, (val / _tot) * 100) : 0;
    return `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="bar-amount">€${r(val)}</div>
    </div>`;
  }

  // ── Righe griglia costi ───────────────────────────────────
  // Array costruito diversamente per ogni prodotto.
  // ...() spread operator con array condizionale:
  //   ...(condizione ? [{...}] : [])
  // aggiunge la riga solo se la condizione è vera.
  let righe = [];

  if (isDadi) {
    righe = [
      { label: '🟢 Materiale',   val: R.mat_cost,  sub: `peso grezzo: ${r(R.peso, 3)} kg` },
      ...(R.tratta > 0  ? [{ label: '🌡 Trattamento', val: R.tratta,  sub: '' }] : []),
      ...(R.placc  > 0  ? [{ label: '🔧 Placchette',  val: R.placc,   sub: '' }] : []),
      { label: '✂ Taglio',       val: R.ta,         sub: `setup: €${r(R.setup_ta)}` },
      ...(R.pt_serve ? [{ label: '◎ Prima torn.', val: R.pt_costo, sub: `setup: €${r(R.setup_pt)}` }] : []),
      ...(R.STAMPAGGIO
        ? [{ label: '⬡ Stampaggio', val: R.st,  sub: `setup: €${r(R.setup_st)}` }]
        : [{ label: '⟋ Fresatura',  val: R.fr,  sub: `setup: €${r(R.setup_fr)}` }]),
      { label: '◎ Tornitura',    val: R.to,         sub: `setup: €${r(R.setup_to)}` },
      { label: '🏷 Marcatura',    val: R.marc_fin,   sub: `setup: €${r(R.setup_marc)}` },
    ];
  } else if (isPrig) {
    righe = [
      { label: '🟢 Materiale',   val: R.mat_cost,   sub: `peso grezzo: ${r(R.peso, 3)} kg` },
      ...(R.trattamento  > 0 ? [{ label: '🌡 Trattamento',   val: R.trattamento,  sub: '' }] : []),
      ...(R.attrez       > 0 ? [{ label: '🔧 Attrezzatura',  val: R.attrez,       sub: '' }] : []),
      ...(!R.FANTINA  ? [{ label: '✂ Taglio',     val: R.ta_costo,  sub: `setup: €${r(R.setup_taglio)}` }] : []),

      <div class="tempo-cell"><div class="tc-label">Stampaggio</div><div class="tc-val">${Math.round(R.tempo_stamp)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Tornitura</div><div class="tc-val">${Math.round(R.tempo_torn)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Fresatura</div><div class="tc-val">${Math.round(R.tempo_fres)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Rullatura</div><div class="tc-val">${Math.round(R.t_rull)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Stamp.</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Torn1</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Fresa</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Rullatura</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>` : `
      <div class="tempo-cell"><div class="tc-label">Taglio</div><div class="tc-val">${Math.round(R.ta_tempo)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Tornitura</div><div class="tc-val">${Math.round(R.tempo_torn)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Fresatura</div><div class="tc-val">${Math.round(R.tempo_fres)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Rullatura</div><div class="tc-val">${Math.round(R.t_rull)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Torn1</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Fresa</div><div class="tc-val">3600<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Rullatura</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>`;
  } else {
    tempiGridHTML = `
      <div class="tempo-cell"><div class="tc-label">Taglio</div><div class="tc-val">${Math.round(R.tempo_ta)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Smusso</div><div class="tc-val">${Math.round(R.smusso_t)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Rullatura</div><div class="tc-val">${Math.round(R.t_rull)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Taglio</div><div class="tc-val">300<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Smusso</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Rullatura</div><div class="tc-val">1800<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">Marcatura</div><div class="tc-val">${Math.round(R.tempo_marc)}<span class="tc-unit"> s</span></div></div>
      <div class="tempo-cell"><div class="tc-label">A.Marcatura</div><div class="tc-val">${R.tempo_setup_marc}<span class="tc-unit"> s</span></div></div>`;
  }

  // ── Costruzione HTML finale ───────────────────────────────
  // Tutto viene scritto in panel.innerHTML in un solo assegnamento.
  // Le variabili HTML costruite sopra (gridHTML, barreHTML, ecc.)
  // vengono interpolate con ${...}.
  panel.innerHTML = `

    <!-- 1. Card costo totale -->
    <div class="result-card primary">
      <div class="cost-header">● COSTO TOTALE UNITARIO</div>
      <div class="cost-value"><span class="currency">€</span>${r(R.costo_tot ?? R.totale)}<span class="unit">/ pz</span></div>
      <div class="cost-summary">
        Lavorazione: <strong>€${r(R.costo_lav ?? R.lavorazione)}</strong>&nbsp;&nbsp;|&nbsp;&nbsp;
        Materiale: <strong>€${r(isViti ? R.mat_cost_plus : R.mat_cost)}</strong>
        ${R.tratta       > 0 ? `&nbsp;&nbsp;|&nbsp;&nbsp;Trattamento: <strong>€${r(R.tratta)}</strong>` : ''}
        ${R.trattamento  > 0 ? `&nbsp;&nbsp;|&nbsp;&nbsp;Trattamento: <strong>€${r(R.trattamento)}</strong>` : ''}
      </div>
    </div>

    <!-- 2. Griglia dettaglio voci -->
    <div class="cost-grid">${gridHTML}</div>

    <!-- 3. Grafico a barre -->
    <div class="result-card">
      <div class="breakdown-title">▎ Composizione costo unitario</div>
      ${bar('Materiale', R.mat_cost, 'mat')}
      ${isDadi  && R.STAMPAGGIO  ? bar('Stampaggio', R.st + R.setup_st, 'torn') : ''}
      ${isDadi  && !R.STAMPAGGIO ? bar('Fresatura',  R.fr + R.setup_fr, 'smusso') : ''}
      ${isDadi  ? bar('Tornitura', R.to + R.setup_to, 'torn') : ''}
      ${isPrig  ? bar('Tornitura', R.to_costo + R.setup_torn, 'torn') : ''}
      ${isPrig  ? bar('Rullatura', R.ru_costo + R.setup_rull, 'rull') : ''}
      ${isOcchio && R.STAMPAGGIO ? bar('Stampaggio', R.st_costo + R.setup_stamp, 'torn') : ''}
      ${isOcchio ? bar('Tornitura', R.to_costo + R.setup_torn, 'torn') : ''}
      ${isOcchio ? bar('Fresatura', R.fr_costo + R.setup_fres, 'smusso') : ''}
      ${isOcchio ? bar('Rullatura', R.ru_costo + R.setup_rull, 'rull') : ''}
      ${isViti  && R.ha_stamp  ? bar('Stampaggio', R.stamp_fin + R.setup_stamp, 'torn') : ''}
      ${isViti  && R.ha_torn   ? bar('Tornitura',  R.torn_fin  + R.setup_torn,  'torn') : ''}
      ${isViti  && R.ha_fresa  ? bar('Fresatura',  R.fresa_fin + R.setup_fresa, 'smusso') : ''}
      ${isViti  && R.ha_brocc  ? bar('Brocciatura',R.brocc_fin + R.setup_brocc, 'smusso') : ''}
      ${isViti  ? bar('Rullatura', R.rull_fin + R.setup_rull, 'rull') : ''}
      ${!isDadi && !isPrig && !isOcchio && !isViti &&  isTornito ? bar('Tornitura', R.torni_fin + R.setup_torn, 'torn') : ''}
      ${!isDadi && !isPrig && !isOcchio && !isViti && !isTornito ? bar('Taglio',    R.taglio_fin + R.setup_taglio, 'taglio') : ''}
      ${!isDadi && !isPrig && !isOcchio && !isViti && !isTornito ? bar('Smusso',    R.smusso_fin + R.setup_smusso, 'smusso') : ''}
      ${!isDadi && !isPrig && !isOcchio && !isViti ? bar('Rullatura', R.rulla_fin + R.setup_rull, 'rull') : ''}
      ${bar('Marcatura', R.marc_fin + (R.setup_marc || 0), 'marc')}
      ${R.tratta       > 0 ? bar('Trattamento', R.tratta,      'bonif') : ''}
      ${R.trattamento  > 0 ? bar('Trattamento', R.trattamento, 'bonif') : ''}
    </div>

    <!-- 4. Geometria (solo dadi / prigionieri / occhio) -->
    ${dadiInfoHTML}
    ${prigInfoHTML}
    ${occhioInfoHTML}
    ${vitiInfoHTML}

    <!-- 5. Barre (solo con BARRA_GIUSTA) -->
    ${barreHTML}

    <!-- 6. Tempi e gestionale -->
    <div class="result-card">
      <div class="breakdown-title">▎ Tempi (secondi per pezzo)</div>
      <div class="tempi-grid">${tempiGridHTML}</div>
      <div class="gestionale-wrap">
        <div class="gestionale-title">▎ Per il gestionale</div>
        <div style="display:flex;align-items:flex-start;gap:10px">
          <!-- <pre> mantiene i newline (\n) nella stringa -->
          <pre id="tempi-gestionale" class="gestionale-pre">${R.tempi_gestionale}</pre>
          <!-- data-tempi: i \n sono escaped (\n → \\n) perché gli attributi
               HTML non supportano newline reali. Vengono ri-convertiti
               in newline veri nel listener del bottone COPIA. -->
          <button class="copia-btn" data-tempi="${R.tempi_gestionale.replace(/\n/g, '\\n')}">COPIA</button>
        </div>
        <div id="copy-feedback" class="copy-feedback"></div>
      </div>
    </div>

    <!-- 7. Peso e lotto -->
    <div class="result-card">
      <div class="breakdown-title">▎ Peso e lotto</div>
      <div class="cost-grid" style="margin-top:0">
        <!-- diametro medio: non applicabile per dadi e occhio -->
        ${(!isDadi && !isOcchio && !isViti) ? `<div class="cost-row"><div class="cost-row-label">Diametro medio</div><div class="cost-row-value">${r(R.diam, 1)} mm</div></div>` : ''}
        ${isViti ? `<div class="cost-row"><div class="cost-row-label">Diametro medio</div><div class="cost-row-value">${r(R.medio, 2)} mm</div></div>` : ''}
        <div class="cost-row"><div class="cost-row-label">Peso singolo</div><div class="cost-row-value">${r(R.peso, 3)} kg</div></div>
        <div class="cost-row">
          <!-- etichetta dinamica: "sottocommessa" se qta_x > 0, altrimenti "lotto" -->
          <div class="cost-row-label">${R.qta_x > 0
            ? `⭐ Peso sottocommessa (×${R.qta_x})`
            : `⭐ Peso lotto (×${R.qta})`}</div>
          <div class="cost-row-value accent">${r(R.peso_principale, 2)} kg</div>
          <!-- modificatore peso: coefficiente > 1 applicato al peso dichiarato
               per coprire sfridi, tolleranze di taglio, imprecisioni.
               Varia in base alla fascia di peso totale del lotto. -->
          <div class="cost-row-sub">reale: ${r(R.peso_principale_reale, 2)} kg — coeff. ${r(R.mod_peso, 3)}</div>
        </div>
        <!-- riga peso lotto completo: appare solo se qta_x > 0 (sottocommessa) -->
        ${R.peso_lotto_completo !== null ? `
        <div class="cost-row">
          <div class="cost-row-label">Peso lotto totale (×${R.qta})</div>
          <div class="cost-row-value">${r(R.peso_lotto_completo, 2)} kg</div>
          <div class="cost-row-sub">approntamenti su ${R.qta} pz${R.qta_str ? ` (${R.qta_str})` : ''}</div>
        </div>` : (R.qta_str ? `
        <!-- dettaglio somma qtà: appare se la qtà era una somma (300+240...) -->
        <div class="cost-row" style="grid-column:span 2">
          <div class="cost-row-label">Dettaglio quantità</div>
          <div class="cost-row-value" style="font-size:13px">${R.qta_str}</div>
        </div>` : '')}
      </div>
    </div>

    <!-- Eventuali messaggi dal modulo (avvisi, note speciali) -->
    ${R.messages && R.messages.length > 0
      ? R.messages.map(m => `<div class="info-box">${m}</div>`).join('')
      : ''}
  `;

  // ── Listener bottone COPIA ────────────────────────────────
  // Aggiunto QUI perché il bottone non esisteva prima di
  // scrivere panel.innerHTML.
  //
  // clipboard.writeText() = API moderna, funziona su HTTPS e localhost.
  // execCommand('copy') = vecchio metodo di fallback (sempre funziona).
  panel.querySelector('.copia-btn')?.addEventListener('click', function() {
    // Ripristina i newline reali (\\n → \n)
    const text = (this.dataset.tempi || '').replace(/\\n/g, '\n');
    navigator.clipboard.writeText(text).catch(() => {
      // Fallback: textarea temporaneo, selezione, copia, rimozione
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
    const fb = document.getElementById('copy-feedback');
    if (fb) {
      fb.textContent = '✓ Copiato negli appunti';
      setTimeout(() => fb.textContent = '', 2000); // sparisce dopo 2s
    }
  });
}

</script>
</body>
</html>
